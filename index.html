<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة القاعات والمعامل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: right-side nav rail + working area; details open in a drawer from the left. Accent = deep teal ink, neutrals biased toward it. */
:root{
  --bg:#f2f5f5; --surface:#ffffff; --surface-2:#f7f9f9; --ink:#132327; --muted:#5a6b6f; --line:#d8e0e1;
  --accent:#0c6b70; --accent-ink:#ffffff; --accent-soft:#e0efef;
  --ok:#1b7743; --ok-soft:#e2f2e8; --warn:#9a5d00; --warn-soft:#fbefd8; --bad:#b0302a; --bad-soft:#f8e3e1; --off:#667276; --off-soft:#e9eded;
  --font-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --radius:10px; --shadow:0 10px 30px rgba(10,40,45,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1719; --surface:#162124; --surface-2:#1b282b; --ink:#e3ecec; --muted:#93a5a8; --line:#2a3a3d;
    --accent:#4fb3b3; --accent-ink:#06191a; --accent-soft:#163a3b;
    --ok:#5cc58a; --ok-soft:#173326; --warn:#e3a947; --warn-soft:#3a2c12; --bad:#ef7b72; --bad-soft:#3d1d1b; --off:#8d9a9d; --off-soft:#222e31;
    --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#162124; --surface-2:#1b282b; --ink:#e3ecec; --muted:#93a5a8; --line:#2a3a3d;
  --accent:#4fb3b3; --accent-ink:#06191a; --accent-soft:#163a3b;
  --ok:#5cc58a; --ok-soft:#173326; --warn:#e3a947; --warn-soft:#3a2c12; --bad:#ef7b72; --bad-soft:#3d1d1b; --off:#8d9a9d; --off-soft:#222e31;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font-body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.3}
.app{display:flex;min-height:100%}
.rail{width:232px;flex:none;background:var(--surface);border-inline-start:0;border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{padding:4px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand h1{font-size:17px}
.brand small{color:var(--muted);font-size:12.5px;display:block}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--bad);color:#fff;font-size:12px;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.nav-group{font-size:11.5px;font-weight:600;color:var(--muted);padding:14px 12px 4px;letter-spacing:.2px}
.nav-group:first-of-type{padding-top:2px}
.nav.ext{color:var(--muted);font-size:13.5px;border:1px dashed var(--line);margin-top:10px}
.nav.ext:hover{color:var(--accent);border-color:var(--accent)}
.rail-foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:10px;display:flex;flex-direction:column;gap:8px}
main{flex:1;min-width:0;padding:24px 28px 60px}
.topbar{display:flex;justify-content:flex-end;margin:-10px 0 4px}
.bell{position:relative;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.bell:hover,.bell.on{border-color:var(--accent);color:var(--accent)}
.bell-badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h2{font-size:24px}
.page-head p{margin:2px 0 0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:start;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile b{font:600 28px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13.5px}
.tile.bad b{color:var(--bad)} .tile.warn b{color:var(--warn)} .tile.ok b{color:var(--ok)}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel>h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel>h3 .count{color:var(--muted);font-weight:500;font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:8px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.off{background:var(--off-soft);color:var(--off)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.plain::before{display:none}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;margin:2px 0 2px 4px;white-space:nowrap}
.tag.miss{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.tag.no{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:12px 14px}
.card.stripe-bad{border-inline-start:4px solid var(--bad)} .card.stripe-warn{border-inline-start:4px solid var(--warn)}
.card.stripe-acc{border-inline-start:4px solid var(--accent)} .card.stripe-ok{border-inline-start:4px solid var(--ok)}
.card.stripe-off{border-inline-start:4px solid var(--off)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-head h4{font-size:15px}
.meta{color:var(--muted);font-size:13.5px}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cand:first-of-type{border-top:0}
.score{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.score i{display:block;width:64px;height:6px;border-radius:3px;background:var(--off-soft);overflow:hidden;position:relative}
.score i::after{content:"";position:absolute;inset:0;inset-inline-end:auto;width:var(--w);background:var(--accent);border-radius:3px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
select,input[type=text],input[type=number],input[type=date],textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-height:34px}
textarea{min-height:80px;width:100%;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font:inherit;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg .n{font-variant-numeric:tabular-nums;margin-inline-start:6px;font-size:12px;padding:0 6px;border-radius:8px;background:var(--surface-2)}
.rq{padding:14px 16px;min-width:0}
.req-sess{min-width:0;max-width:100%}
.sess-table{position:relative}
.sess-table table{min-width:600px;table-layout:fixed}
.rq.done{opacity:.88}
.req-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.req-top .when{margin-inline-start:auto;color:var(--muted);font-size:12.5px}
.rq h4{font-size:15.5px;margin:8px 0 4px}
.rq .facts{display:flex;flex-wrap:wrap;gap:2px 0;color:var(--muted);font-size:13px}
.rq .facts span:not(:last-child)::after{content:"·";margin:0 8px;color:var(--line)}
.rq-when{display:flex;flex-wrap:wrap;gap:8px 28px;margin:10px 0 2px}
.rq-when dt{font-size:12px;color:var(--muted)}
.rq-when dd{margin:2px 0 0;font-weight:600;font-size:14.5px}
.rq .quote{margin:10px 0 0;padding:8px 12px;background:var(--surface-2);border-inline-start:3px solid var(--line);border-radius:6px;font-size:14px}
.req-sess{margin-top:12px}
.req-sess summary{margin-bottom:8px}
.sess-table th,.sess-table td{padding:7px 10px;font-size:13.5px;vertical-align:middle}
.sess-table .sess-group td{background:var(--surface-2);font-weight:600;font-size:12.5px;color:var(--muted)}
.req-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface-2)}
.num{font-variant-numeric:tabular-nums}
.grid{table-layout:fixed;min-width:880px}
.grid th:first-child,.grid td:first-child{width:92px}
.grid td{padding:6px;height:86px}
.grid td.day{font-weight:600;color:var(--ink);background:var(--surface-2);vertical-align:middle}
.chip-cls{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:start;border:1px solid var(--line);border-inline-start:4px solid var(--ok);border-radius:7px;background:var(--surface);padding:4px 8px;margin-bottom:4px;cursor:pointer;font-size:12.5px;line-height:1.45}
.chip-cls b{font-weight:600}
.chip-cls span{color:var(--muted)}
.chip-cls:hover{border-color:var(--accent)}
.chip-cls.st-waiting{border-inline-start-color:var(--bad);background:var(--bad-soft)}
.chip-cls.st-issue{border-inline-start-color:var(--warn);background:var(--warn-soft)}
.chip-cls.st-online{border-inline-start-color:var(--off);border-style:dashed;border-inline-start-style:solid}
.chip-cls.st-exc{border-inline-start-color:var(--accent)}
.chip-cls.st-shift{border-inline-start-color:var(--accent);background:var(--accent-soft)}
.chip-cls.st-pending{border-inline-start-color:var(--accent);border-style:dashed;border-inline-start-style:solid;background:var(--accent-soft)}
.cell-add{display:block;width:100%;border:1px dashed var(--line);background:transparent;border-radius:7px;color:var(--muted);font-size:12px;padding:2px 6px;cursor:pointer;opacity:.55}
.cell-add:hover,.cell-add:focus-visible{opacity:1;border-color:var(--accent);color:var(--accent)}
.chip-cls.st-ghost{border-inline-start-color:var(--off);background:transparent;opacity:.75}
.chip-cls.st-ghost b{text-decoration:line-through}
.grid tr.today td.day{color:var(--accent)}
.grid tr.today td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.week-nav{display:flex;align-items:center;gap:8px}
.week-nav b{min-width:190px;text-align:center;font-variant-numeric:tabular-nums}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0}
.checks{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.checks label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-inline-end:5px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,20,22,.35);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(560px,100%);background:var(--bg);border-inline-start:1px solid var(--line);box-shadow:var(--shadow);z-index:21;display:flex;flex-direction:column}
.drawer-head{padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.drawer-head h3{font-size:19px}
.drawer-body{overflow-y:auto;padding:16px 20px 40px;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.sec-title{font:600 14px/1.4 var(--font-display);color:var(--muted);margin:0 0 8px}
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.req:first-child{border-top:0}
.req small{grid-column:1/-1;color:var(--muted)}
.eq-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.eq-row:first-child{border-top:0}
.mini{table-layout:fixed;font-size:12px}
.mini td,.mini th{padding:5px;text-align:center;border:1px solid var(--line)}
.mini td.busy{background:var(--accent-soft);color:var(--accent);font-weight:600}
details summary{cursor:pointer;color:var(--muted);font-size:13.5px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13.5px}
.badbox{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:13.5px}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 12px;font-size:13.5px}
.infobox{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 12px;font-size:13.5px}
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:flex-start;justify-content:center;z-index:40;padding:4vh 16px;overflow-y:auto;overscroll-behavior:contain}
.dialog{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:20px 20px 0;width:min(480px,100%);display:flex;flex-direction:column;gap:12px;margin:auto 0}
.dialog.wide{width:min(760px,100%)}
.dialog .fields{display:flex;flex-direction:column;gap:12px}
.dialog.wide .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.dialog.wide .fields .full{grid-column:1/-1}
@media (max-width:560px){ .dialog.wide .fields{grid-template-columns:1fr} }
html.modal-open,html.modal-open body{overflow:hidden}
.dialog h3{font-size:18px}
.dialog label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.dialog label>*{color:var(--ink)}
.dlg-err{color:var(--bad);margin:0;font-size:13.5px}
.dialog [hidden]{display:none !important}
.dlg-actions{display:flex;gap:8px;flex-direction:row-reverse;justify-content:flex-start;position:sticky;bottom:0;margin:0 -20px;padding:12px 20px 16px;background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 12px 12px}
.toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:50;box-shadow:var(--shadow);font-weight:500;max-width:90vw}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.course{display:flex;flex-direction:column;gap:12px}
.course-kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.kind-box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.kind-box h5{margin:0 0 6px;font:600 14px var(--font-display)}
.reqline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.reqline:first-of-type{border-top:0}
.reqline input[type=text]{grid-column:1/-1;min-height:30px;font-size:13px;padding:3px 8px}
.toggle{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer;background:var(--surface)}
.toggle.on{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:600}
.rank{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rank:first-of-type{border-top:0}
.rank .n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.check-res{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
@media (max-width:980px){ .cols{grid-template-columns:1fr} }
@media (max-width:760px){
  .app{flex-direction:column}
  .rail{position:static;height:auto;width:auto;flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--line);padding:8px}
  .brand,.rail-foot,.nav-group{display:none}
  .nav.ext{margin-top:0}
  .nav{white-space:nowrap}
  main{padding:16px}
}
@media (prefers-reduced-motion:no-preference){ .drawer{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(-24px);opacity:.6}} }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="القائمة الرئيسية"></nav>
  <main id="main"></main>
</div>
<div id="drawer-root"></div>
<script>
'use strict';
/* ============ Constants ============ */
const DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const SLOTS=['09:00 – 11:00','11:00 – 13:00','13:00 – 15:00','15:00 – 17:00'];
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DEF_ROOMKIND={hall:'قاعة',amphi:'مدرج',lab:'معمل',sectionRoom:'غرفة سكاشن',meeting:'قاعة اجتماعات'};
const DEF_EQ={projector:'بروجكتور',mic:'ميكروفون وسماعات',ac:'تكييف',internet:'إنترنت',smartboard:'سبورة ذكية',camera:'كاميرا بث',computers:'أجهزة كمبيوتر',excel:'Microsoft Excel',spss:'SPSS',accsoft:'برنامج محاسبي (ERP)'};
let EQ=DEF_EQ, ROOMKIND=DEF_ROOMKIND; // bound to the master data in state (bindMaster)

function roomState(r){
  if(r.status==='maintenance') return 'maintenance';
  if(r.status==='closed') return 'closed';
  const broken=Object.values(r.equipment).includes('broken') || (r.devices && r.devices.working<r.devices.total);
  return broken?'partial':'available';
}
function needed(c){ return Math.ceil(c.students*(1+S.settings.buffer/100)); }
function roomCap(r,kind){
  const c=r.caps[kind]; if(!c) return null;
  let max=c[1], byDevices=false;
  if(kind==='lab' && r.devices && r.devices.working<max){ max=r.devices.working; byDevices=true; }
  return {min:c[0],max,byDevices};
}
function reqsOf(c){
  const base=c.exceptional?(c.reqs||[]):((course(c.courseId).reqs[c.kind])||[]);
  const ov=c.overrides||{};
  const list=base.map(q=>ov[q.eq]&&q.mandatory?{...q,mandatory:false,overridden:ov[q.eq],wasMandatory:true}:{...q});
  if(c.mode==='hybrid'){
    for(const eq of ['camera','mic','internet']){
      const ex=list.find(q=>q.eq===eq);
      if(ex){ if(!ex.mandatory && !ex.overridden){ ex.mandatory=true; ex.reason=ex.reason||'مطلوب للتدريس حضوري - أونلاين'; ex.auto=true; } }
      else list.push(ov[eq]?{eq,mandatory:false,reason:'مطلوب للتدريس حضوري - أونلاين',auto:true,overridden:ov[eq],wasMandatory:true}:{eq,mandatory:true,reason:'مطلوب للتدريس حضوري - أونلاين',auto:true});

}

/* Evaluate how well room r fits class c. ignoreTime → specs only (used for preferred-room checks). */
function evaluate(r,c,opts={}){
  const out={ok:true,score:100,notes:[],missing:[],reason:null,preferred:null,need:needed(c),cap:null};
  const fail=msg=>{ out.ok=false; out.reason=msg; out.score=0; return out; };
  const st=roomState(r);
  if(!opts.ignoreStatus){
    if(st==='maintenance') return fail(`في الصيانة${r.maintenance&&r.maintenance.to?' حتى '+fmtDate(r.maintenance.to):''}`);
    if(st==='closed') return fail('مغلق إداريًا');
  }
  const co=c.exceptional?null:course(c.courseId);
  if(r.dept && (!co || co.dept!==r.dept)) return fail(`مخصص لقسم ${r.dept} فقط`);
  const cap=roomCap(r,c.kind);
  if(!cap) return fail(`غير مهيأ لـ${S.usage[c.kind]}`);
  out.cap=cap;
  if(out.need>cap.max) return fail(`السعة ${cap.max}${cap.byDevices?' (عدد الأجهزة العاملة)':''} أقل من المطلوب ${out.need}`);
  if(!opts.ignoreTime){ const occ=occupant(r.id,c.day,c.slot,c.id,c); if(occ) return fail(`محجوز لـ ${shortLabel(occ)}`); }
  for(const q of reqsOf(c)){
    const s=r.equipment[q.eq]; if(s==='ok') continue;
    const what=EQ[q.eq]+(s==='broken'?' (معطل)':'');
    if(q.mandatory) return fail(`ناقص متطلب إلزامي: ${what}`);
    out.missing.push(what); out.score-=12;
  }
  const waste=(cap.max-out.need)/cap.max; out.score-=Math.round(waste*35);
  if(out.need<cap.min){ out.score-=10; out.notes.push(`أقل من الحد الأدنى (${cap.min}) — هدر سعة`); }
  const pref=prefFor(r,c); if(pref){ out.score+=5; out.preferred=pref; }
  out.score=Math.max(0,Math.min(100,out.score));
  return out;
}

/* Who could use room r at day/slot: waiting classes first, then classes sitting in a worse room. */
function freedCandidates(roomId,day,slot){
  const r=room(roomId); const res=[];
  for(const c of S.classes){
    if(c.status!=='active'||c.pending||c.mode==='online'||c.day!==day||c.slot!==slot||c.roomId===roomId) continue;
    const e=evaluate(r,c); if(!e.ok) continue;
    if(!c.roomId){ res.push({c,e,kind:'waiting'}); continue; }
    const cur=currentFit(c); const curScore=cur.ok?cur.score:0;
    if(!cur.ok || e.score-curScore>=10) res.push({c,e,kind:'improve',from:c.roomId,curScore,curOk:cur.ok});

}

/* ============ Dates & one-off changes (shift / cancel for one date) ============ */
const parseD=s=>{ const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); };
const isoD=dt=>dt.toISOString().slice(0,10);
const addDays=(s,n)=>{ const d=parseD(s); d.setUTCDate(d.getUTCDate()+n); return isoD(d); };
const dayIdx=s=>(parseD(s).getUTCDay()+1)%7; // السبت=0 … الخميس=5، الجمعة=6
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const weekStart=s=>addDays(s,-dayIdx(s));
/* The calendar's "current week": today's week, or the term's first week when the term hasn't started yet. */
const curWeek=()=>weekStart(S.today<S.term.start?S.term.start:S.today);
function dateLabel(s){ const i=dayIdx(s), d=parseD(s); return `${i<6?DAYS[i]:'الجمعة'} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; }
function nextDateFor(dayI){ let d=addDays(S.today,1); while(dayIdx(d)!==dayI) d=addDays(d,1); return d; }
/* Every session actually happening on a date+slot: weekly ones not moved away, plus ones moved in. */
function sessionsOn(date,slot){
  const di=dayIdx(date), out=[]; const wn=Math.floor(daysBetween(S.term.start,date)/7)+1;
  for(const c of S.classes){
    if(c.status!=='active'||c.day!==di||c.slot!==slot) continue;
    if(wn<wk(c)[0]||wn>wk(c)[1]) continue;
    if(S.oneoffs.some(o=>o.classId===c.id&&o.date===date)) continue;
    out.push({c,roomId:c.mode==='online'?null:c.roomId,shifted:false});
  }
  for(const o of S.oneoffs){
    if(o.type!=='shift'||o.newDate!==date||o.newSlot!==slot) continue;
    const c=cls(o.classId); if(c&&c.status==='active') out.push({c,roomId:o.roomId,shifted:true,o});
  }
  return out;
}
function roomBlockedOn(r,date){
  if(r.status==='closed') return 'مغلق إداريًا';
  if(r.status==='maintenance'){ const m=r.maintenance||{}; if((!m.from||date>=m.from)&&(!m.to||date<=m.to)) return `في الصيانة${m.to?' حتى '+fmtDate(m.to):''}`; }
  return null;
}
/* Can class c's session be held at date+slot? Returns problems, warnings, and the best free room. */
function slotOption(c,origDate,date,slot){
  const opt={date,slot,problems:[],warns:[],room:null,e:null,rank:0};
  if(dayIdx(date)===6){ opt.problems.push('الجمعة إجازة'); return opt; }
  const others=sessionsOn(date,slot).filter(x=>x.c.id!==c.id);
  const doc=c.instructor&&others.find(x=>x.c.instructor===c.instructor);
  if(doc) opt.problems.push(`${person(c.instructor).name} لديه ${shortLabel(doc.c)}${doc.shifted?' (منقولة)':''}`);
  const coh=others.find(x=>sameStudents(c,x.c));
  if(coh) opt.problems.push(`الطلاب لديهم ${shortLabel(coh.c)}`);
  if(c.mode!=='online'){
    const rooms=S.rooms.map(r=>{
      if(roomBlockedOn(r,date)||others.some(x=>x.roomId===r.id)) return null;
      const e=evaluate(r,c,{ignoreTime:true,ignoreStatus:true}); return e.ok?{r,e}:null;
    }).filter(Boolean).sort((a,b)=>b.e.score-a.e.score);
    if(rooms.length){ opt.room=rooms[0].r; opt.e=rooms[0].e; } else opt.problems.push('لا يوجد مكان مناسب متاح');
  }
  if(audOf(c).length){
    const busyDay=SLOTS.some((_,s)=>sessionsOn(date,s).some(x=>x.c.id!==c.id&&audOf(x.c).some(a=>audOf(c).includes(a))));
    if(!busyDay) opt.warns.push('لا توجد محاضرات للطلاب في هذا اليوم');
  }
  const limit=addDays(origDate,S.settings.shiftWindow);
  if(date>limit) opt.warns.push(`بعد مهلة الـ ${S.settings.shiftWindow} أيام`);
  if(date<=S.today) opt.problems.push('تاريخ مضى');
  opt.rank=(opt.e?opt.e.score:90)-2*Math.abs(daysBetween(origDate,date))+(slot===c.slot?3:0)-8*opt.warns.length;
  return opt;
}
function shiftSuggestions(c,origDate,max=6){
  const res=[]; let d=addDays(S.today,1); const end=addDays(origDate,S.settings.shiftWindow);
  for(;d<=end;d=addDays(d,1)){
    if(d===origDate||dayIdx(d)===6) continue;
    for(let s=0;s<SLOTS.length;s++){ const o=slotOption(c,origDate,d,s); if(!o.problems.length) res.push(o); }
  }
  return res.sort((a,b)=>b.rank-a.rank).slice(0,max);
}

function proposeSlot(c){
  let best=null;

    const t={...c,day:d,slot:sl};
    const busy=S.classes.some(o=>o.id!==c.id&&o.status==='active'&&o.day===d&&o.slot===sl&&overlapW(o,c)&&((c.instructor&&o.instructor===c.instructor)||sameStudents(c,o)));

    let rank=score+(sameDay>0&&sameDay<3?6:0)-(sameDay>=3?10:0)-d*0.5-sl*0.2;

function syncFromCM(){

    applyOffering(oid,p); S.cmSeen[oid]=h; changed=true;

  return changed;
}

function fieldHtml(f){
  const id='f-'+f.id, v=esc(f.value??'');
  if(f.type==='checks') return `<fieldset class="full" style="border:0;padding:0;margin:0"><legend class="meta" style="font-size:13.5px">${esc(f.label)}</legend><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;margin-top:4px">${f.options.map(([k,t,on])=>`<label style="flex-direction:row;align-items:center;gap:6px;color:var(--ink)"><input type="checkbox" name="${id}" value="${k}"${on?' checked':''}> ${esc(t)}</label>`).join('')}</div></fieldset>`;
  let ctl;
  if(f.type==='textarea') ctl=`<textarea id="${id}">${v}</textarea>`;
  else if(f.type==='select') ctl=`<select id="${id}">${f.options.map(([k,t])=>`<option value="${esc(k)}"${String(k)===String(f.value??'')?' selected':''}>${esc(t)}</option>`).join('')}</select>`;
  else ctl=`<input id="${id}" type="${f.type||'text'}" value="${v}">`;
  return `<label for="${id}"${f.type==='textarea'||f.full?' class="full"':''}${f.showIf?` data-show-field="${f.showIf[0]}" data-show-value="${esc(f.showIf[1])}" hidden`:''}>${esc(f.label)}${f.required?' *':''}${ctl}</label>`;
}
function ask(o){
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='overlay';
    ov.innerHTML=`<form class="dialog${o.wide?' wide':''}" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h3 id="dlg-t">${esc(o.title)}</h3>${o.body?`<div>${o.body}</div>`:''}<div class="fields">${(o.fields||[]).map(fieldHtml).join('')}</div><p class="dlg-err" hidden></p><div class="dlg-actions"><button class="btn ${o.danger?'danger':'primary'}" type="submit">${esc(o.ok||'تأكيد')}</button><button type="button" class="btn ghost" data-x>رجوع</button></div></form>`;
    document.body.append(ov);
    const form=ov.querySelector('form');
    /* Fields shown only for one value of another field (e.g. the new building's name). */
    const syncShow=()=>form.querySelectorAll('[data-show-field]').forEach(l=>{ const src=form.querySelector('#f-'+l.dataset.showField); l.hidden=!src||src.value!==l.dataset.showValue; });
    form.addEventListener('change',e=>{ if(e.target.id&&form.querySelector(`[data-show-field="${e.target.id.slice(2)}"]`)){ syncShow(); const shown=form.querySelector(`[data-show-field="${e.target.id.slice(2)}"]:not([hidden]) input`); if(shown) shown.focus(); } });
    syncShow();
    (form.querySelector('input,textarea,select')||form.querySelector('[type=submit]')).focus();
    document.documentElement.classList.add('modal-open');
    const close=v=>{ ov.remove(); if(!document.querySelector('.overlay')) document.documentElement.classList.remove('modal-open'); res(v); };
    ov.querySelector('[data-x]').onclick=()=>close(null);
    ov.addEventListener('keydown',e=>{ if(e.key==='Escape') close(null); });
    form.onsubmit=e=>{
      e.preventDefault(); const vals={};
      for(const f of o.fields||[]){
        if(f.type==='checks'){ vals[f.id]=[...form.querySelectorAll(`[name="f-${f.id}"]:checked`)].map(x=>x.value); continue; }
        const el=form.querySelector('#f-'+f.id); if(el.closest('[hidden]')){ vals[f.id]=''; continue; } vals[f.id]=el.value.trim();
        if(f.required&&!vals[f.id]){ const er=form.querySelector('.dlg-err'); er.hidden=false; er.textContent=`أدخل ${f.label} للمتابعة`; el.focus(); return; }
      }
      close(vals);
    };
  });
}

/* Session table for a distribution request from Course Management, grouped by lecture group. */
function cmSessionsTable(q){
  const cs=q.classIds.map(cls).filter(Boolean);
  const lg=c=>String(c.group||'').split('-')[0];
  const groups=[...new Set(cs.map(lg))];
  const order=c=>(c.kind==='lecture'?0:1)*1000+(c.day==null?99:c.day)*10+(c.slot==null?9:c.slot);
  const kinds=[...new Set(cs.map(c=>c.kind))].map(k=>{ const c=cs.find(x=>x.kind===k), w=wk(c), every=c.total===w[1]-w[0]+1;
    return `<li><b>ال${(KIND_NOUN[k]||[S.usage[k]])[1]||S.usage[k]}:</b> ${countOf(c.total||0,k)} لكل مجموعة${every?'، مرة كل أسبوع':''}، من الأسبوع ${w[0]} إلى الأسبوع ${w[1]} (${weekSpan(w[0],w[1])})</li>`; }).join('');
  const names=list=>[...new Set(list.filter(c=>c.instructor).map(c=>person(c.instructor).name))].join('، ')||'—';
  const row=c=>{ const fit=c.roomId?currentFit(c):null;
    const whenCell=c.status==='cancelled'?`<span style="color:var(--bad)">${c.returned?'تعذّر التوزيع':'مرفوض'}</span>`:c.day==null?'<span style="color:var(--bad)">لا يوجد موعد مناسب</span>':`${esc(when(c))}<div class="meta">من ${shortDate(weekDate(wk(c)[0],c.day))} إلى ${shortDate(weekDate(wk(c)[1],c.day))}</div>`;
    const roomCell=c.status==='cancelled'||c.day==null?'—':c.mode==='online'?'أونلاين':c.roomId?esc(room(c.roomId).name):'<span style="color:var(--bad)">بلا مكان</span>';
    return `<tr><td><b>${esc(groupTxt(c))}</b></td><td class="num">${c.students}</td><td>${whenCell}</td><td>${roomCell}</td><td>${fit?scoreHtml(fit.score):''}</td>
      <td>${q.status==='new'&&c.status!=='cancelled'?`<button class="btn sm ghost" data-act="openClass" data-id="${c.id}" aria-label="تغيير موعد أو مكان ${esc(shortLabel(c))}">تغيير</button>`:''}</td></tr>`; };
  return `<ul class="meta" style="margin:0 0 8px;padding-inline-start:18px">${kinds}</ul>
  <div class="tbl-wrap sess-table"><table><colgroup><col style="width:24%"><col style="width:10%"><col style="width:20%"><col style="width:20%"><col style="width:16%"><col style="width:10%"></colgroup>
  <thead><tr><th>المجموعة</th><th>الطلاب</th><th>الموعد الأسبوعي</th><th>المكان</th><th>المناسبة</th><th><span class="sr-only">إجراء</span></th></tr></thead><tbody>
    ${groups.map(g=>{ const rows=cs.filter(c=>lg(c)===g).sort((a,b)=>order(a)-order(b)); const lec=rows.filter(c=>c.kind==='lecture'), oth=rows.filter(c=>c.kind!=='lecture');
      const head=`مجموعة المحاضرة ${esc(g.replace(/^L/,''))}${lec.length?` · المحاضرة: ${esc(names(lec))}`:''}${oth.length?` · ${esc([...new Set(oth.map(c=>S.usage[c.kind]))].join(' و'))}: ${esc(names(oth))}`:''}`;
      return `<tr class="sess-group"><td colspan="6">${head}</td></tr>`+rows.map(row).join(''); }).join('')}
  </tbody></table></div>`;
}
/* Next date (on or after the term start and after today) that falls on weekday d. */
const nextOn=d=>{ let x=addDays(S.today<S.term.start?addDays(S.term.start,-1):S.today,1); for(let i=0;i<7&&dayIdx(x)!==d;i++) x=addDays(x,1); return x; };
/* The explicit date and time of each request, shown as labelled fields on the card. */
function reqWhen(q){
  if(q.type==='cm'||q.type==='cm_change'){ const cs=q.classIds.map(cls).filter(c=>c&&c.day!=null); if(!cs.length) return [];
    const first=cs.map(c=>weekDate(wk(c)[0],c.day)).sort()[0], last=cs.map(c=>weekDate(wk(c)[1],c.day)).sort().pop();
    return [['تبدأ',dateLabel(first)],['تنتهي',dateLabel(last)],['العدد',mix(q.classIds.map(cls))]]; }
  if(q.type==='shift') return [['التاريخ',dateLabel(q.targetDate)],['الأوقات',q.classIds.map(id=>SLOTS[cls(id).slot]).join('، ')],['الموعد المفضّل',q.preferred?`${dateLabel(q.preferred.date)} · ${SLOTS[q.preferred.slot]}`:'لم يحدد']];
  if(q.type==='online'){ const c=cls(q.classId); return [['الموعد الأسبوعي',`${DAYS[c.day]} · ${SLOTS[c.slot]}`],['من',dateLabel(nextOn(c.day))],['حتى',dateLabel(weekDate(wk(c)[1],c.day))]]; }
  if(q.type==='cancel_once'){ const c=cls(q.classId); return [['التاريخ',q.onDate?dateLabel(q.onDate):q.when],['الوقت',SLOTS[c.slot]]]; }
  if(q.type==='booking'||q.type==='exceptional'){ const p=q.payload; return [['التاريخ',dateLabel(p.date||nextOn(p.day))],['الوقت',SLOTS[p.slot]]]; }
  if(q.type==='maintenance') return [['تاريخ البلاغ',q.date]];
  return [];
}
function reqCard(q){
  const fromName=q.fromLabel||person(q.from).name; let title='', facts=[], approve='اعتماد', extra='';
  if(q.type==='cm'||q.type==='cm_change'){ const co=course(q.courseId); const cs=q.classIds.map(cls).filter(Boolean); title=`${co.code} · ${co.name}`;
    if(q.type==='cm'){ facts=[cs[0]?audName(cs[0]):''].filter(Boolean); approve='اعتماد التوزيع';
      const prop=cs.filter(c=>c.status!=='cancelled'&&c.day!=null&&(c.roomId||c.mode==='online')).length, none=cs.filter(c=>c.status!=='cancelled'&&(c.day==null||(!c.roomId&&c.mode!=='online'))).length;
      extra=`<details class="req-sess"${q.status==='new'?' open':''}><summary>المحاضرات والسكاشن (${mix(cs)})${q.status==='new'?` · ${pill(`${prop} مقترح`,'acc')}${none?' '+pill(`${none} بلا اقتراح`,'bad'):''}`:''}</summary>${cmSessionsTable(q)}</details>`; }
    else { facts=[mix(cs)]; approve='تأكيد وتحرير الأماكن';
      extra=`<div style="margin-top:6px">${cs.map(c=>`<div class="cand"><div><b>${esc(label(c))}</b> <span class="meta">${when(c)}</span><div class="meta">${c.release?`${esc(c.release.text)} · تحجز حاليًا ${c.roomId?esc(room(c.roomId).name):'—'} · بعد التأكيد ${c.release.action==='online'?'ستصبح أونلاين':'ستُلغى'} وسيُعرض المكان على المواد التي تحتاجه`:'تم التأكيد'}</div></div><button class="btn sm ghost" data-act="openClass" data-id="${c.id}">التفاصيل</button></div>`).join('')}</div>`; } }
  if(q.type==='shift'){ const whole=q.classIds.length===personSessionsOn(q.from,q.targetDate).length+q.classIds.filter(id=>oneoffFor(id,q.targetDate)).length;
    title=`نقل محاضرات ${dateLabel(q.targetDate)}`; facts=[whole?'اليوم كله':'جزء من اليوم',q.classIds.map(id=>shortLabel(cls(id))).join('، ')]; approve='مراجعة واختيار المواعيد'; }
  if(q.type==='online'){ const c=cls(q.classId); title=label(c); facts=[c.roomId?`حاليًا في ${room(c.roomId).name}`:(c.mode==='online'?'أصبحت أونلاين':'بلا مكان'),'المدة: بقية الترم']; approve='اعتماد التحويل وتحرير المكان'; }
  if(q.type==='cancel_once'){ const c=cls(q.classId); title=label(c); facts=[c.roomId?room(c.roomId).name:'—']; approve='اعتماد الإلغاء'; }
  if(q.type==='booking'){ const p=q.payload; title=`${course(p.courseId).name} — ${S.usage[p.kind]} ${p.group}`; facts=[`${p.students} طالب`,person(p.instructor).name]; approve='اعتماد واختيار مكان'; }
  if(q.type==='exceptional'){ const p=q.payload; title=S.usage[p.kind]; facts=[`${p.students} فرد`,`المتطلبات: ${p.reqs.map(x=>EQ[x.eq]+(x.mandatory?' (إلزامي)':'')).join('، ')||'—'}`]; approve='اعتماد واختيار مكان'; }
  if(q.type==='maintenance'){ title=room(q.roomId).name; facts=[`${q.devicesBroken} جهاز معطل`]; approve='تسجيل العطل'; }
  const whenRows=reqWhen(q);
  const st=q.status==='new'?pill('جديد','acc'):q.status==='approved'?pill('معتمد','ok'):q.status==='returned'?pill('أُعيد إلى إدارة المواد','warn'):pill('مرفوض','bad');
  const late=q.type==='shift'&&q.status==='new'&&daysBetween(S.today,q.targetDate)<S.settings.minNotice;
  const second=q.type==='cm_change'?'':q.type==='cm'?`<button class="btn sm" data-act="returnCM" data-id="${q.id}">تعذّر التوزيع</button>`:`<button class="btn sm ghost danger" data-act="reject" data-id="${q.id}">رفض</button>`;
  return `<article class="card rq ${q.status==='new'?'stripe-acc':'stripe-off done'}" aria-label="${esc(REQ_TYPE[q.type]+': '+title)}">
    <div class="req-top"><span class="pill plain acc">${REQ_TYPE[q.type]}</span>${st}<span class="when">من ${esc(fromName)} · ${esc(q.date)}</span></div>
    <h4>${esc(title)}</h4>
    ${whenRows.length?`<dl class="rq-when">${whenRows.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`:''}
    <div class="facts">${facts.map(x=>`<span>${esc(x)}</span>`).join('')}${late?`<span style="color:var(--warn)">ورد قبل الموعد بأقل من ${S.settings.minNotice} أيام</span>`:''}</div>
    ${q.text?`<p class="quote">${esc(q.text)}</p>`:''}
    ${q.reason?`<p class="meta" style="margin:8px 0 0"><b>${q.status==='returned'?'سبب تعذّر التوزيع':'سبب الرفض'}:</b> ${esc(q.reason)}</p>`:''}
    ${extra}
    ${q.status==='new'?`<div class="req-foot"><button class="btn sm primary" data-act="${q.type==='shift'?'openShift':'approve'}" data-id="${q.id}">${approve}</button>${second}</div>`:''}
  </article>`;
}

function viewCalendar(){
  if(!S.ui.calWeek) S.ui.calWeek=curWeek();
  const ws=S.ui.calWeek, cur=curWeek(), f=S.ui.calFilters;
  const dates=DAYS.map((_,i)=>addDays(ws,i));
  const weekNo=Math.floor(daysBetween(S.term.start,ws)/7)+1;
  const match=c=>(!f.person||c.instructor===f.person)&&(!f.cohort||audOf(c).includes(f.cohort))&&(!f.kind||c.kind===f.kind);
  const inB=rid=>!f.building||(rid&&room(rid).building===f.building);
  const stats={live:0,shifted:0,gone:0,cancelled:0,noroom:0};
  const cell=(date,s)=>{
    const live=sessionsOn(date,s).filter(x=>match(x.c)&&inB(x.roomId)).map(x=>{
      stats.live++; if(x.shifted) stats.shifted++;
      const st=x.shifted?'shift':x.c.pending?'pending':x.c.mode==='online'?'online':!x.roomId?'waiting':x.c.exceptional?'exc':'ok';
      if(st==='waiting') stats.noroom++;
      const where=x.c.mode==='online'?'أونلاين':x.roomId?room(x.roomId).name:'بدون مكان';
      return `<button class="chip-cls st-${st}" data-act="openClass" data-id="${x.c.id}"><b>${esc(shortLabel(x.c))}</b><span>${esc(where)}${x.c.instructor?' · '+esc(person(x.c.instructor).name):''}${x.shifted?` · منقولة من ${dateLabel(x.o.date)}`:''}</span></button>`;
    });
    const di=dayIdx(date);
    const gone=S.oneoffs.filter(o=>{ const c=cls(o.classId); return o.date===date&&c.day===di&&c.slot===s&&match(c)&&inB(c.roomId); }).map(o=>{
      const c=cls(o.classId); if(o.type==='cancel') stats.cancelled++; else stats.gone++;
      return `<button class="chip-cls st-ghost" data-act="openClass" data-id="${c.id}" data-date="${date}"><b>${esc(shortLabel(c))}</b><span>${o.type==='cancel'?'ملغاة هذه المرة':`نُقلت إلى ${dateLabel(o.newDate)} ${SLOTS[o.newSlot]}`}</span></button>`;
    });
    const canAdd=date>S.today&&dayIdx(date)!==6;
    return live.join('')+gone.join('')+(canAdd?`<button class="cell-add" data-act="manualBook" data-date="${date}" data-slot="${s}" aria-label="حجز يدوي ${dateLabel(date)} ${SLOTS[s]}" title="حجز يدوي">+ حجز</button>`:'');
  };
  const body=dates.map(d=>`<tr class="${d===S.today?'today':''}"><td class="day">${dateLabel(d)}${d===S.today?'<div class="meta">اليوم</div>':''}</td>${SLOTS.map((_,si)=>`<td>${cell(d,si)}</td>`).join('')}</tr>`).join('');
  const weeks=Array.from({length:S.term.weeks},(_,i)=>addDays(S.term.start,i*7));
  const people=S.people.filter(p=>p.role!=='coordinator');
  return `<div class="page-head"><div><h2>التقويم</h2><p>جميع المحاضرات في الأسبوع المختار، مع النقل والإلغاء والحجوزات اليدوية. اضغط "+ حجز" في أي خانة للحجز فيها.</p></div>
  <button class="btn primary" data-act="manualBook">حجز يدوي</button>
  <div class="week-nav"><button class="btn sm" data-act="week" data-d="-7" aria-label="الأسبوع السابق">‹ السابق</button><b>${dateLabel(dates[0])} – ${dateLabel(dates[5])}</b><button class="btn sm" data-act="week" data-d="7" aria-label="الأسبوع الجاي">التالي ›</button><button class="btn sm ${ws===cur?'primary':''}" data-act="week" data-d="0">${S.today<S.term.start?'أول أسبوع':'الأسبوع الحالي'}</button></div></div>
  <div class="filters">
    <label class="meta" style="display:flex;align-items:center;gap:6px">الأسبوع<select data-chg="calWeek" aria-label="اختر الأسبوع">${weeks.map((w,i)=>`<option value="${w}"${w===ws?' selected':''}>الأسبوع ${i+1} · ${dateLabel(w)}${w===cur?(S.today<S.term.start?' (أول أسبوع)':' (الحالي)'):''}</option>`).join('')}${weekNo<1||weekNo>S.term.weeks?`<option value="${ws}" selected>خارج الترم · ${dateLabel(ws)}</option>`:''}</select></label>
    <label class="meta" style="display:flex;align-items:center;gap:6px">أو تاريخ<input type="date" data-chg="calDate" value="${ws}" aria-label="روح لأسبوع تاريخ معين"></label>
    <select data-chg="calF" data-k="building" aria-label="المبنى"><option value="">كل المباني</option>${S.buildings.map(b=>`<option value="${b.id}"${f.building===b.id?' selected':''}>${esc(b.name)}</option>`).join('')}</select>
    <select data-chg="calF" data-k="person" aria-label="المحاضر"><option value="">كل المحاضرين</option>${people.map(p=>`<option value="${p.id}"${f.person===p.id?' selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <select data-chg="calF" data-k="cohort" aria-label="الفرقة"><option value="">كل الفرق</option>${S.cohorts.map(c=>`<option value="${c.id}"${f.cohort===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select>
    <select data-chg="calF" data-k="kind" aria-label="النوع"><option value="">كل الأنواع</option>${['lecture','section','lab'].map(k=>`<option value="${k}"${f.kind===k?' selected':''}>${S.usage[k]}</option>`).join('')}</select>
  </div>
  <div class="legend"><span><b class="num" style="color:var(--ink)">${S.term.name} · ${weekNo>=1&&weekNo<=S.term.weeks?'الأسبوع '+weekNo:'خارج الترم'}${ws===cur?(S.today<S.term.start?` (يبدأ ${dateLabel(S.term.start)})`:' (الحالي)'):''}</b></span><span>${stats.live} محاضرة وسكشن وحجز</span>${stats.shifted?`<span>${stats.shifted} منقولة إلى هذا الأسبوع</span>`:''}${stats.gone?`<span>${stats.gone} نُقلت إلى موعد آخر</span>`:''}${stats.cancelled?`<span>${stats.cancelled} ملغية</span>`:''}${stats.noroom?`<span style="color:var(--bad)">${stats.noroom} بدون مكان</span>`:''}</div>
  <div class="legend"><span><i style="background:var(--ok)"></i>في موعدها</span><span><i style="background:var(--accent)"></i>منقولة إلى هذا الموعد</span><span><i style="background:var(--off)"></i>أونلاين، أو منقولة/ملغاة هذه المرة</span><span><i style="background:var(--bad)"></i>بدون مكان</span></div>
  <div class="tbl-wrap"><table class="grid"><thead><tr><th>اليوم</th>${SLOTS.map(s=>`<th class="num">${s}</th>`).join('')}</tr></thead>
  <tbody>${body}</tbody></table></div>`;
}

/* Manual booking: a one-off (or weekly until a date) exceptional booking; rooms ranked for that date and slot. */
function bookOptions(c){
  const all=S.rooms.map(r=>{
    const blocked=roomBlockedOn(r,c.date);
    if(blocked) return {r,e:{ok:false,reason:blocked}};
    if(c.until&&c.until!==c.date){ const b2=roomBlockedOn(r,c.until); if(b2) return {r,e:{ok:false,reason:b2+' (في آخر الفترة)'}}; }
    return {r,e:evaluate(r,c,{ignoreStatus:true})};
  });
  return {ok:all.filter(x=>x.e.ok).sort((a,b)=>b.e.score-a.e.score),no:all.filter(x=>!x.e.ok)};
}
function drawerBook(c){
  const o=bookOptions(c);
  return `<div class="drawer-head"><div><div class="meta">حجز يدوي · ${esc(S.usage[c.kind])}</div><h3 id="dr-t">${esc(c.title)}</h3><div class="meta" style="margin-top:4px">${when(c)} · ${c.students} فرد · ${esc(c.organizer)}</div></div><button class="btn ghost" data-act="closeDrawer" aria-label="إغلاق">إغلاق</button></div>
  <div class="drawer-body" id="drawer-body">
    ${c.reqs.length?`<div class="meta">المتطلبات: ${c.reqs.map(q=>EQ[q.eq]+(q.mandatory?' (إلزامي)':'')).join('، ')}</div>`:''}
    ${c.note?`<div class="infobox">${esc(c.note)}</div>`:''}
    <section><div class="sec-title">الأماكن المتاحة والمناسبة (${o.ok.length})</div><div class="card">${o.ok.length?o.ok.map(({r,e})=>`<div class="cand"><div><b>${esc(r.name)}</b> <span class="meta">${roomWhere(r)}</span><div class="meta">السعة ${e.cap.min}–${e.cap.max} · المطلوب ${e.need} · ${scoreHtml(e.score)}</div><div>${evalTags(e)||'<span class="tag">كل المتطلبات موجودة</span>'}</div></div><button class="btn sm primary" data-act="confirmBook" data-r="${r.id}">احجز هنا</button></div>`).join(''):'<div class="empty">لا يوجد مكان مناسب متاح في هذا الموعد. جرّب فترة أو يومًا آخر.</div>'}</div>
    <details style="margin-top:8px"><summary>أماكن مستبعدة وسبب الاستبعاد (${o.no.length})</summary><div class="card" style="margin-top:6px">${o.no.map(({r,e})=>`<div class="cand"><div><b>${esc(r.name)}</b><div class="meta">${esc(e.reason)}</div></div></div>`).join('')}</div></details></section>
    <div class="row-actions"><button class="btn" data-act="manualBook" data-edit="1">تعديل بيانات الحجز</button></div>
  </div>`;
}
function drawerShift(q){
  const doc=person(q.from); const done=q.classIds.every(id=>oneoffFor(id,q.targetDate));
  const optRow=(c,o,isPref)=>`<div class="opt"><div><b>${dateLabel(o.date)} · ${SLOTS[o.slot]}</b>${isPref?' '+pill('يفضّله عضو هيئة التدريس','acc'):''}
    <div class="meta">${c.mode==='online'?'أونلاين':o.room?`${esc(o.room.name)} · ${roomWhere(o.room)} · ${scoreHtml(o.e.score)}`:''}</div>
    <div>${o.problems.map(p=>`<span class="tag no">${esc(p)}</span>`).join('')}${o.warns.map(w=>`<span class="tag miss">${esc(w)}</span>`).join('')}${o.e?evalTags(o.e):''}</div></div>
    ${o.problems.length?'<span></span>':`<button class="btn sm primary" data-act="pickShift" data-q="${q.id}" data-c="${c.id}" data-date="${o.date}" data-slot="${o.slot}" data-r="${o.room?o.room.id:''}">اختيار</button>`}</div>`;
  return `<div class="drawer-head"><div><div class="meta">${REQ_TYPE.shift} · ${esc(doc.name)}</div><h3 id="dr-t">${dateLabel(q.targetDate)}</h3><div style="margin-top:4px">${q.status==='new'?pill('يحتاج إلى اختيار المواعيد','acc'):q.status==='approved'?pill('معتمد','ok'):pill('مرفوض','bad')}</div></div><button class="btn ghost" data-act="closeDrawer" aria-label="إغلاق">إغلاق</button></div>
  <div class="drawer-body" id="drawer-body">
    <div class="infobox">${esc(q.text)}</div>
    <p class="hint" style="margin:0">النقل لهذه المرة فقط، ولا يتغير الجدول الأسبوعي. الاقتراحات مرتبة حسب: أقرب يوم، ثم الفترة نفسها، ثم أنسب مكان، ثم وجود محاضرات للفرقة في ذلك اليوم.</p>
    ${q.classIds.map(id=>{ const c=cls(id); const o=oneoffFor(id,q.targetDate);
      return `<section class="card ${o?'stripe-ok':'stripe-acc'}"><div class="card-head"><div><h4>${esc(label(c))}</h4><div class="meta">الأصلي: ${dateLabel(q.targetDate)} ${SLOTS[c.slot]} · ${c.mode==='online'?'أونلاين':c.roomId?esc(room(c.roomId).name):'بدون مكان'} · ${c.students} طالب</div></div></div>
      ${o?`<div class="okbox" style="margin-top:8px">نُقلت إلى ${dateLabel(o.newDate)} ${SLOTS[o.newSlot]}${o.roomId?' في '+esc(room(o.roomId).name):''} ${q.status==='new'?`<button class="btn sm ghost" data-act="undoShift" data-id="${o.id}">تراجع</button>`:''}</div>`
      :q.status!=='new'?'':`${q.preferred?optRow(c,slotOption(c,q.targetDate,q.preferred.date,q.preferred.slot),true):''}
        <div class="sec-title" style="margin-top:10px">اقتراحات النظام</div>${(()=>{ const sg=shiftSuggestions(c,q.targetDate).filter(o=>!(q.preferred&&o.date===q.preferred.date&&o.slot===q.preferred.slot)); return sg.length?sg.map(o=>optRow(c,o,false)).join(''):'<div class="empty">لا يوجد موعد متاح خلال المهلة.</div>'; })()}`}
      </section>`; }).join('')}
    ${q.status==='new'?`<div class="row-actions"><button class="btn primary" data-act="approveShift" data-id="${q.id}" ${done?'':'disabled'}>اعتماد الطلب وإبلاغ الطلاب</button><button class="btn danger" data-act="reject" data-id="${q.id}">رفض</button>${done?'':'<span class="hint">اختر موعدًا لكل محاضرة أولًا.</span>'}</div>`:''}
  </div>`;
}

  </tbody></table></div><p class="hint">* السعة محسوبة على عدد الأجهزة العاملة.</p>`;

        <label>القاعة<select data-chg="pref" data-k="roomId">${S.rooms.map(r=>`<option value="${r.id}"${p.roomId===r.id?' selected':''}>${esc(r.name)}</option>`).join('')}</select></label>

      ${p.result?prefResultHtml(p.result):'<p class="hint" style="margin-top:10px">إذا لم تُختر مادة، سيفحص النظام كل المحاضرات والسكاشن التي يدرّسها عضو هيئة التدريس.</p>'}
    </section>

function prefCheck(){
  const p=S.ui.pref; const r=room(p.roomId);
  const list=S.classes.filter(c=>c.status==='active'&&c.instructor===p.doctorId&&c.courseId&&(!p.courseId||c.courseId===p.courseId));
  return list.map(c=>{ const e=evaluate(r,c,{ignoreTime:true,ignoreStatus:true}); return {c,e,level:!e.ok?'bad':(e.missing.length||e.notes.length?'warn':'ok')}; });
}
function prefResultHtml(res){
  if(!res.length) return `<div class="infobox" style="margin-top:10px">لا توجد محاضرات أو سكاشن لهذا المحاضر بهذا الاختيار في الترم الحالي.</div>`;
  return `<div class="check-res">${res.map(({c,e,level})=>`<div class="${level==='ok'?'okbox':level==='warn'?'warnbox':'badbox'}"><b>${esc(label(c))}</b> (${c.students} طالب): ${level==='ok'?'مناسبة':level==='warn'?'مناسبة مع ملاحظات — '+esc([...e.missing.map(m=>'ناقص '+m),...e.notes].join('، ')):'غير مناسبة — '+esc(e.reason)}</div>`).join('')}</div>`;
}

/* ============ Master data (البيانات الأساسية) ============ */
const CORE_USAGE=['lecture','section','lab'];
const MASTER_TABS=[['equipment','الأدوات'],['usage','أنواع الاستخدام'],['kinds','أنواع الأماكن'],['buildings','المباني']];
const MASTER_ONE={equipment:'أداة',usage:'نوع استخدام',kinds:'نوع مكان',buildings:'مبنى'};
function bindMaster(){
  if(!S.equipment) S.equipment={...DEF_EQ};
  if(!S.roomKinds) S.roomKinds={...DEF_ROOMKIND};
  EQ=S.equipment; ROOMKIND=S.roomKinds;
}
/* Where each item is used, so deletion can be blocked with a reason. */
function masterUse(tab,key){
  if(tab==='equipment'){
    const rooms=S.rooms.filter(r=>r.equipment[key]).length;
    const courses=S.courses.filter(c=>Object.values(c.reqs).some(l=>l.some(q=>q.eq===key))).length+S.classes.filter(c=>c.exceptional&&(c.reqs||[]).some(q=>q.eq===key)).length;
    return {n:rooms+courses,text:[rooms?`${rooms} مكان`:'',courses?`${courses} مادة أو حجز`:''].filter(Boolean).join(' · ')};
  }
  if(tab==='usage'){
    const rooms=S.rooms.filter(r=>r.caps[key]).length, cl=S.classes.filter(c=>c.status==='active'&&c.kind===key).length;
    return {n:rooms+cl,text:[rooms?`${rooms} مكان`:'',cl?`${cl} محاضرة أو حجز`:''].filter(Boolean).join(' · '),core:CORE_USAGE.includes(key)};
  }
  if(tab==='kinds'){ const n=S.rooms.filter(r=>r.kind===key).length; return {n,text:n?`${n} مكان`:''}; }
  const n=S.rooms.filter(r=>r.building===key).length; return {n,text:n?`${n} مكان`:''};
}
function masterList(tab){
  if(tab==='equipment') return Object.entries(S.equipment).map(([k,v])=>({key:k,name:v}));
  if(tab==='usage') return Object.entries(S.usage).map(([k,v])=>({key:k,name:v}));
  if(tab==='kinds') return Object.entries(S.roomKinds).map(([k,v])=>({key:k,name:v}));
  return S.buildings.map(b=>({key:b.id,name:b.name}));
}
function masterSet(tab,key,name){
  if(tab==='equipment') S.equipment[key]=name;
  else if(tab==='usage') S.usage[key]=name;
  else if(tab==='kinds') S.roomKinds[key]=name;
  else { const b=building(key); if(b) b.name=name; else S.buildings.push({id:key,name}); }
}
function masterDel(tab,key){
  if(tab==='equipment') delete S.equipment[key];
  else if(tab==='usage') delete S.usage[key];
  else if(tab==='kinds') delete S.roomKinds[key];
  else S.buildings=S.buildings.filter(b=>b.id!==key);
}
function viewMaster(){
  const tab=S.ui.masterTab||'equipment'; const label=MASTER_TABS.find(t=>t[0]===tab)[1];
  const list=masterList(tab);
  const notes={equipment:'الأدوات التي تُسجَّل في الأماكن وتُطلب في المواد. تُرسل هذه القائمة إلى نظام إدارة المواد لتُكتب المتطلبات بالأسماء نفسها.',usage:'الاستخدامات التي لها سعة من – إلى في كل مكان. المحاضرة والسكشن والمعمل أساسية لأنها واردة من نظام إدارة المواد.',kinds:'أنواع الأماكن التي تظهر عند إضافة مكان وفي الفلاتر.',buildings:'المباني التي تتبعها الأماكن.'};
  return `<div class="page-head"><div><h2>البيانات الأساسية</h2><p>القوائم التي يعتمد عليها باقي النظام. لا يُسمح بحذف عنصر مستخدم.</p></div><button class="btn primary" data-act="masterAdd">إضافة ${MASTER_ONE[tab]}</button></div>
  <div class="row-actions" role="group" aria-label="القوائم" style="margin-bottom:12px">${MASTER_TABS.map(([k,t])=>`<button class="btn sm ${k===tab?'primary':''}" data-act="masterTab" data-v="${k}" aria-pressed="${k===tab}">${t} <span class="num">(${masterList(k).length})</span></button>`).join('')}</div>
  <p class="hint" style="margin-top:0">${notes[tab]}</p>
  <div class="tbl-wrap"><table><thead><tr><th>الاسم</th><th>مستخدم في</th><th></th></tr></thead><tbody>
  ${list.map(it=>{ const u=masterUse(tab,it.key); const block=u.core?'أساسي، وارد من نظام إدارة المواد':u.n?`مستخدم في ${u.text}`:'';
    return `<tr><td><b>${esc(it.name)}</b>${u.core?` ${pill('أساسي','acc')}`:''}</td><td class="meta">${esc(u.text)||'غير مستخدم'}</td><td><div class="row-actions"><button class="btn sm" data-act="masterEdit" data-k="${esc(it.key)}">تعديل الاسم</button><button class="btn sm danger" data-act="masterDelete" data-k="${esc(it.key)}" ${block?`disabled title="${esc(block)}"`:''}>حذف</button></div></td></tr>`; }).join('')}

/* Opened from a cancelled/moved occurrence in the calendar: show what happened on that date only.
   Weekly actions (move room, cancel for the term…) live in the weekly class view, one click away. */
function drawerOccurrence(c,date){
  const o=S.oneoffs.find(x=>x.classId===c.id&&x.date===date);
  if(!o) return drawerClass(c);
  const co=c.exceptional?null:course(c.courseId);
  const what=o.type==='cancel'?`أُلغيت هذه المحاضرة يوم ${dateLabel(date)} فقط.`:`نُقلت هذه المحاضرة يوم ${dateLabel(date)} فقط إلى ${dateLabel(o.newDate)} ${SLOTS[o.newSlot]}${o.roomId?' في '+esc(room(o.roomId).name):''}.`;
  return `<div class="drawer-head"><div><div class="meta">${c.exceptional?'حجز استثنائي':esc(co.code)}</div><h3 id="dr-t">${esc(label(c))}</h3><div style="margin-top:4px">${o.type==='cancel'?pill(`ملغاة ${dateLabel(date)}`,'off'):pill(`منقولة ${dateLabel(date)}`,'warn')}</div></div><button class="btn ghost" data-act="closeDrawer" aria-label="إغلاق">إغلاق</button></div>
  <div class="drawer-body" id="drawer-body">
    <div class="${o.type==='cancel'?'infobox':'warnbox'}"><b>${what}</b>${o.reason?`<br>السبب: ${esc(o.reason)}`:''}<br>${c.roomId&&c.mode!=='online'?`${esc(room(c.roomId).name)} متاح في هذا الموعد للحجز الاستثنائي فقط. `:''}باقي الأسابيع في موعدها المعتاد.</div>
    <dl class="kv">
      <dt>الموعد المعتاد</dt><dd>${when(c)}</dd>
      <dt>المكان المعتاد</dt><dd>${c.mode==='online'?'أونلاين':c.roomId?esc(room(c.roomId).name):'—'}</dd>
      ${c.exceptional?`<dt>الجهة</dt><dd>${esc(c.organizer)}</dd>`:`<dt>المحاضر</dt><dd>${esc(person(c.instructor).name)}</dd><dt>الطلاب</dt><dd>${esc(audName(c))} · ${esc(groupTxt(c))}</dd>`}

  </div>`;
}

/* Only times where the lecturer and the cohort/group are free; each option says how many suitable rooms are free then. */
function timePicker(c,ph){
  const opts=[];
  for(let d=0;d<DAYS.length;d++) for(let sl=0;sl<SLOTS.length;sl++){
    const t={...c,day:d,slot:sl};
    const busy=S.classes.some(o=>o.id!==c.id&&o.status==='active'&&o.day===d&&o.slot===sl&&overlapW(o,c)&&((c.instructor&&o.instructor===c.instructor)||sameStudents(c,o)));
    if(busy) continue;
    const n=c.mode==='online'?null:S.rooms.filter(r=>evaluate(r,t).ok).length;
    opts.push([`${d}-${sl}`,`${DAYS[d]} ${SLOTS[sl]}${n==null?'':` · ${n?n+' مكان مناسب':'لا يوجد مكان'}`}`,n]);
  }
  opts.sort((a,b)=>(b[2]??99)-(a[2]??99));
  return `<select data-chg="setTime" data-id="${c.id}" aria-label="اختر الموعد"><option value="">— ${ph||'اختر يومًا وفترة'} —</option>${opts.map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join('')}</select><div class="hint">تُعرض فقط المواعيد التي يكون فيها المحاضر والفرقة متاحين.</div>`;
}

  },
  addCap(d){ const r=room(d.id); const k=$('#addcap-'+r.id).value; if(!k) return; r.caps[k]=[1,r.seats]; log('إضافة سعة',`${r.name}: ${S.usage[k]} 1–${r.seats}`); freedCheckRoomAll(r.id,`${r.name} أصبحت مهيأة لـ${S.usage[k]}`); },
  delCap(d){ const r=room(d.id); delete r.caps[d.k]; log('حذف سعة',`${r.name}: ${S.usage[d.k]}`); affectedNotice(r,unfitInRoom(r),`لم تعد مهيأة لـ${S.usage[d.k]}`); },
  prefCheck(){ S.ui.pref.result=prefCheck(); },
  async prefSave(){
    const p=S.ui.pref; const res=prefCheck(); p.result=res;
    if(S.preferred.some(x=>x.doctorId===p.doctorId&&x.roomId===p.roomId&&(x.courseId||'')===p.courseId)){ render(); toast('هذا التعيين موجود بالفعل'); return; }
    let reason='';
    if(res.some(x=>x.level!=='ok')){
      render();
      const v=await ask({title:'القاعة غير مناسبة لكل المحاضرات',body:prefResultHtml(res)+'<p class="meta">يمكنك المتابعة، لكن يجب كتابة السبب.</p>',fields:[{id:'reason',label:'السبب',type:'textarea',required:true}],ok:'حفظ مع التحذير'});
      if(!v) return; reason=v.reason;
    }
    const rank=S.preferred.filter(x=>x.roomId===p.roomId).length+1;
    S.preferred.push({id:nid('pf'),doctorId:p.doctorId,roomId:p.roomId,courseId:p.courseId||null,rank,reason});
    log('قاعة مفضلة',`${person(p.doctorId).name} ← ${room(p.roomId).name} (${p.courseId?course(p.courseId).name:'كل المواد'}) · ترتيب ${rank}`,reason);
    render(); toast('تم حفظ القاعة المفضلة');
  },
  prefMove(d){
    const x=find(S.preferred,d.id); const list=S.preferred.filter(p=>p.roomId===x.roomId).sort((a,b)=>a.rank-b.rank);
    const i=list.indexOf(x), j=i+Number(d.d); if(j<0||j>=list.length) return;
    [list[i].rank,list[j].rank]=[list[j].rank,list[i].rank];
    log('ترتيب أولوية',`${room(x.roomId).name}: ${person(x.doctorId).name} ← ترتيب ${x.rank}`);
  },
  prefDel(d){ const x=find(S.preferred,d.id); S.preferred=S.preferred.filter(p=>p.id!==d.id); S.preferred.filter(p=>p.roomId===x.roomId).sort((a,b)=>a.rank-b.rank).forEach((p,i)=>p.rank=i+1); log('حذف قاعة مفضلة',`${person(x.doctorId).name} ← ${room(x.roomId).name}`); },
  async newRoom(){
    const v=await ask({title:'إضافة مكان جديد',wide:true,fields:[
      {id:'name',label:'الاسم',required:true,value:''},
      {id:'kind',label:'النوع',type:'select',value:'hall',options:Object.entries(ROOMKIND)},
      {id:'building',label:'المبنى',type:'select',value:S.buildings[0].id,options:[...S.buildings.map(b=>[b.id,b.name]),['__new','مبنى جديد…']]},
      {id:'newBuilding',label:'اسم المبنى الجديد',required:true,value:'',showIf:['building','__new']},
      {id:'floor',label:'الدور',required:true,value:'الأول'},
      {id:'seats',label:'أقصى عدد طلاب',type:'number',required:true,value:'40'},
      {id:'devices',label:'عدد الأجهزة (للمعامل)',type:'number',value:''},
      {id:'dept',label:'مخصص لقسم (اختياري)',value:''},
      {id:'eq',label:'الأدوات الموجودة',type:'checks',options:Object.entries(EQ).map(([k,t])=>[k,t,['projector','ac'].includes(k)])}
    ],ok:'إضافة'});
    if(!v) return;
    const name=v.name.trim();
    if(S.rooms.some(r=>r.name===name)){ toast(`يوجد مكان باسم ${name} بالفعل`); return; }
    const seats=Math.max(1,Number(v.seats)||0);
    let bId=v.building;
    if(bId==='__new'){ const bn=v.newBuilding.trim(); if(!bn){ toast('أدخل اسم المبنى الجديد'); return; } bId=nid('b'); S.buildings.push({id:bId,name:bn}); log('إضافة مبنى',bn); }
    const half=Math.max(1,Math.floor(seats/2));
    const caps={
      hall:{lecture:[Math.ceil(seats*.5),seats],section:[10,Math.min(seats,40)],exam:[5,half]},
      amphi:{lecture:[Math.ceil(seats*.4),seats],exam:[10,half],conference:[20,seats]},
      lab:{lab:[Math.min(8,seats),seats],exam:[Math.min(8,seats),seats]},
      sectionRoom:{section:[Math.min(10,seats),seats],exam:[5,half]},
      meeting:{conference:[5,seats],defense:[5,seats],workshop:[5,seats]}
    }[v.kind]||{};
    const equipment={}; for(const e of v.eq) equipment[e]='ok';
    const devN=Number(v.devices)||0;
    if(v.kind==='lab'&&devN) equipment.computers='ok';
    const r={id:nid('r'),name,kind:v.kind,building:bId,floor:v.floor.trim(),seats,equipment,caps,status:'available',maintenance:null,dept:v.dept.trim()||null,devices:v.kind==='lab'&&devN?{total:devN,working:devN}:null};
    S.rooms.push(r);
    log('إضافة مكان',`${r.name} · ${ROOMKIND[r.kind]} · ${building(bId).name} الدور ${r.floor} · ${seats} طالب`);
    freedCheckRoomAll(r.id,`أُضيف مكان جديد: ${r.name}`);
    S.ui.drawer={type:'room',id:r.id};
    toast('تمت إضافة المكان. راجع السعات حسب الاستخدام، وسيصلك إشعار إذا كانت هناك مواد تنتظر مكانًا.');
  },
  masterTab(d){ S.ui.masterTab=d.v; },
  async masterAdd(){
    const tab=S.ui.masterTab||'equipment';
    const v=await ask({title:'إضافة '+MASTER_ONE[tab],fields:[{id:'name',label:'الاسم',required:true}],ok:'إضافة'});
    if(!v) return;
    if(masterList(tab).some(x=>x.name===v.name)){ toast(`${v.name} موجود بالفعل`); return; }
    const key={equipment:'e',usage:'u',kinds:'k',buildings:'b'}[tab]+(++S.seq);
    masterSet(tab,key,v.name); log('بيانات أساسية',`إضافة ${MASTER_ONE[tab]}: ${v.name}`); render();
    toast(tab==='equipment'?'تمت الإضافة. سجّلها في الأماكن التي تتوفر فيها من تفاصيل المكان.':'تمت الإضافة');
  },
  async masterEdit(d){
    const tab=S.ui.masterTab||'equipment'; const it=masterList(tab).find(x=>x.key===d.k);
    const v=await ask({title:'تعديل الاسم',fields:[{id:'name',label:'الاسم',required:true,value:it.name}],ok:'حفظ'});
    if(!v||v.name===it.name) return;
    if(masterList(tab).some(x=>x.name===v.name)){ toast(`${v.name} موجود بالفعل`); return; }
    masterSet(tab,d.k,v.name); log('بيانات أساسية',`${it.name} ← ${v.name}`); render();
  },
  async masterDelete(d){
    const tab=S.ui.masterTab||'equipment'; const it=masterList(tab).find(x=>x.key===d.k); const u=masterUse(tab,d.k);
    if(u.n||u.core){ toast('لا يمكن حذفه لأنه مستخدم'); return; }
    const v=await ask({title:`حذف ${it.name}`,ok:'حذف',danger:true});
    if(!v) return; masterDel(tab,d.k); log('بيانات أساسية',`حذف: ${it.name}`); render();
  },
  async addUsage(){
    const v=await ask({title:'نوع استخدام جديد',fields:[{id:'name',label:'الاسم',required:true}],ok:'إضافة'});
    if(!v) return; S.usage['u'+(++S.seq)]=v.name; log('إعدادات',`نوع استخدام جديد: ${v.name}`); render();
  }
};
const CHG={
  filter(t){ S.ui.filters[t.dataset.k]=t.value; },
  rfilter(t){ S.ui.roomFilters[t.dataset.k]=t.value; },
  pref(t){ S.ui.pref[t.dataset.k]=t.value; if(t.dataset.k==='doctorId') S.ui.pref.courseId=''; S.ui.pref.result=null; },
  buffer(t){ S.settings.buffer=Math.max(0,Math.min(50,Number(t.value)||0)); log('إعدادات',`نسبة الزيادة الاحتياطية ← ${S.settings.buffer}%`); },

  calWeek(t){ S.ui.calWeek=t.value; },
  calDate(t){ if(t.value) S.ui.calWeek=weekStart(t.value); },
  calF(t){ S.ui.calFilters[t.dataset.k]=t.value; },
  ns(t){ const f=S.ui.newShift; f[t.dataset.k]=t.value; if(t.dataset.k==='doctorId'||t.dataset.k==='date') f.picks={}; },
  nsPick(t){ S.ui.newShift.picks[t.dataset.id]=t.checked; },
  nsAll(t){ const f=S.ui.newShift; personSessionsOn(f.doctorId,f.date).forEach(x=>f.picks[x.c.id]=t.checked); },
  setNum(t){ S.settings[t.dataset.k]=Math.max(0,Number(t.value)||0); log('إعدادات',`${t.dataset.k==='shiftWindow'?'مهلة الموعد البديل':'أقل مدة للطلب'} ← ${S.settings[t.dataset.k]} أيام`); },
  setTime(t){
    if(!t.value) return; const c=cls(t.dataset.id); const [d,sl]=t.value.split('-').map(Number);
    c.day=d; c.slot=sl; if(c.roomId){ c.roomId=null; } log('تحديد موعد',`${label(c)} ← ${when(c)}`);
    if(c.mode==='online') notifyPeople(c,`${label(c)}: الموعد ${when(c)} (أونلاين)`); else toast('تم تحديد الموعد. اختر المكان من الاقتراحات.');
  },
  mode(t){
    const c=cls(t.dataset.id); const old=c.mode; c.mode=t.value;
    log('تغيير طريقة التدريس',`${label(c)}: ${MODE[old]} ← ${MODE[c.mode]}`); notifyPeople(c,`${label(c)} أصبحت ${MODE[c.mode]}`);
    if(c.mode==='online') releaseRoom(c,`${label(c)} حُوّلت إلى أونلاين`);
    else if(old==='online') toast('عادت حضوري وهي في الانتظار. اختر مكانًا من الاقتراحات.');
    else if(c.roomId&&!currentFit(c).ok) toast('المكان الحالي تنقصه متطلبات التدريس حضوري - أونلاين (كاميرا وميكروفون وإنترنت)');
  },
  cap(t){
    const r=room(t.dataset.id); const k=t.dataset.k, i=Number(t.dataset.i);
    const val=Math.max(0,Number(t.value)||0); const old=r.caps[k][i]; const next=[...r.caps[k]]; next[i]=val;
    if(next[0]>next[1]){ toast('يجب أن يكون الحد الأدنى أقل من الحد الأقصى'); render(); return; }
    r.caps[k]=next; log('تعديل سعة',`${r.name} (${S.usage[k]}): ${i?'الأقصى':'الأدنى'} ${old} ← ${val}`);
    if(i===1&&val>old) freedCheckRoomAll(r.id,`سعة ${r.name} زادت`);
    if(i===1&&val<old) affectedNotice(r,unfitInRoom(r),'قلّت السعة');
  }
};
document.addEventListener('click',async e=>{
  const nav=e.target.closest('[data-nav]'); if(nav){ go(nav.dataset.nav); return; }
  const jump=e.target.closest('[data-jump]'); if(jump){ const h=document.getElementById(jump.dataset.jump); if(h){ h.closest('section').scrollIntoView({behavior:'smooth',block:'start'}); h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); } return; }
  const t=e.target.closest('[data-act]'); if(!t||t.disabled) return;
  const fn=ACT[t.dataset.act]; if(!fn) return;
  e.preventDefault();
  const r=fn(t.dataset,t);
  if(r&&r.then) await r; else render();
  if(r&&r.then) render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.ui.drawer&&!document.querySelector('.overlay')){ S.ui.drawer=null; $('#drawer-root').dataset.key=''; render(); }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-act]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('input',e=>{ const t=e.target.closest('[data-inp]'); if(t&&S.ui.newShift) S.ui.newShift[t.dataset.k]=t.value; });
document.addEventListener('change',e=>{ const t=e.target.closest('[data-chg]'); if(!t) return; CHG[t.dataset.chg](t); render(); });
window.addEventListener('hashchange',syncHash);
(function(){ const saved=store.get(SAVE_KEY); if(saved&&saved.rooms&&saved.version===4) S={...saved,ui:S.ui}; /* demo wording fix for data saved before 14 Nov */ (S.requests||[]).forEach(q=>{ if(q.id==='q5'&&/ظرف عائلي/.test(q.text||'')) q.text='حضور اجتماع مجلس الكلية في الموعد نفسه، وستُعوَّض المحاضرة لاحقًا.'; }); bindMaster(); if(!S.classes.some(c=>c.cmOffering==='of_acc101_ar')) seedCMRequest(); syncFromCM(); })();
syncHash();
</script>
