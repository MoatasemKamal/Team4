<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المواد الدراسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Same family as the rooms app (rail + working area + left drawer); accent shifts to a deep academic blue so the two systems read as siblings, not twins. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f7f8fb; --ink:#141c2b; --muted:#5a6476; --line:#d9dee7;
  --accent:#2c4a86; --accent-ink:#ffffff; --accent-soft:#e4eaf6;
  --ok:#1b7743; --ok-soft:#e2f2e8; --warn:#9a5d00; --warn-soft:#fbefd8; --bad:#b0302a; --bad-soft:#f8e3e1; --off:#687183; --off-soft:#eaedf2;
  --font-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --radius:10px; --shadow:0 10px 30px rgba(15,25,50,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f131b; --surface:#161c27; --surface-2:#1b2230; --ink:#e4e9f2; --muted:#97a2b6; --line:#2a3242;
    --accent:#8fa9e6; --accent-ink:#0b1426; --accent-soft:#1d2942;
    --ok:#5cc58a; --ok-soft:#173326; --warn:#e3a947; --warn-soft:#3a2c12; --bad:#ef7b72; --bad-soft:#3d1d1b; --off:#8f99ab; --off-soft:#232a37;
    --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f131b; --surface:#161c27; --surface-2:#1b2230; --ink:#e4e9f2; --muted:#97a2b6; --line:#2a3242;
  --accent:#8fa9e6; --accent-ink:#0b1426; --accent-soft:#1d2942;
  --ok:#5cc58a; --ok-soft:#173326; --warn:#e3a947; --warn-soft:#3a2c12; --bad:#ef7b72; --bad-soft:#3d1d1b; --off:#8f99ab; --off-soft:#232a37;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font-body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,h5{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.3}
.app{display:flex;min-height:100%}
.rail{width:232px;flex:none;background:var(--surface);border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{padding:4px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand h1{font-size:17px}
.brand small{color:var(--muted);font-size:12.5px;display:block}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--warn);color:#fff;font-size:12px;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.nav-group{font-size:11.5px;font-weight:600;color:var(--muted);padding:14px 12px 4px;letter-spacing:.2px}
.nav-group:first-of-type{padding-top:2px}
.nav.ext{color:var(--muted);font-size:13.5px;border:1px dashed var(--line);margin-top:10px}
.nav.ext:hover{color:var(--accent);border-color:var(--accent)}
.rail-foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:10px;display:flex;flex-direction:column;gap:8px}
main{flex:1;min-width:0;padding:24px 28px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.page-head h2{font-size:24px}
.page-head p{margin:2px 0 0;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab-group{align-self:center;font-size:12px;color:var(--muted);padding:0 6px 0 2px;border-inline-start:1px solid var(--line);margin-inline-start:4px}
.tab-group:first-child{border:0;margin:0}
.tab .n{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.tile b{font:600 26px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13.5px}
.tile.warn b{color:var(--warn)} .tile.bad b{color:var(--bad)} .tile.ok b{color:var(--ok)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel>h3{font-size:16px;margin-bottom:12px}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:8px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.off{background:var(--off-soft);color:var(--off)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;margin:2px 0 2px 4px;white-space:nowrap}
.tag.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.tag.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text],input[type=number],textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-height:34px}
textarea{min-height:80px;width:100%;resize:vertical}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface-2)}
tfoot td{font-weight:600;background:var(--surface-2)}
.num{font-variant-numeric:tabular-nums}
.meta{color:var(--muted);font-size:13.5px}
.hint{font-size:13px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.load{display:flex;align-items:center;gap:8px}
.load i{display:block;width:120px;height:8px;border-radius:4px;background:var(--off-soft);position:relative;overflow:hidden}
.load i::after{content:"";position:absolute;inset:0;inset-inline-end:auto;width:var(--w);background:var(--c,var(--accent));border-radius:4px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,14,28,.35);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(620px,100%);background:var(--bg);border-inline-start:1px solid var(--line);box-shadow:var(--shadow);z-index:21;display:flex;flex-direction:column}
.drawer-head{padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.drawer-head h3{font-size:19px}
.drawer-body{overflow-y:auto;padding:16px 20px 40px;display:flex;flex-direction:column;gap:14px}
.sec-title{font:600 14px/1.4 var(--font-display);color:var(--muted);margin:0 0 8px}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:12px 14px}
.kind{display:flex;flex-direction:column;gap:10px}
.kind-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kind-head h5{font-size:15px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted)}
.inline select,.inline input{color:var(--ink)}
.grp{display:grid;grid-template-columns:auto 80px minmax(0,1fr);gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.reqline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.reqline:first-child{border-top:0}
.reqline input[type=text]{grid-column:1/-1;min-height:30px;font-size:13px;padding:3px 8px}
.toggle{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer;background:var(--surface)}
.toggle.on{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:600}
.issues{display:flex;flex-direction:column;gap:6px}
.issue{border-radius:8px;padding:7px 12px;font-size:13.5px}
.issue.bad{background:var(--bad-soft);color:var(--bad)} .issue.warn{background:var(--warn-soft);color:var(--warn)}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 12px;font-size:13.5px}
.infobox{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 12px;font-size:13.5px}
pre.json{direction:ltr;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:auto;max-height:420px;margin:0}
.overlay{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:flex-start;justify-content:center;z-index:40;padding:4vh 16px;overflow-y:auto;overscroll-behavior:contain}
.dialog{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:20px 20px 0;width:min(480px,100%);display:flex;flex-direction:column;gap:12px;margin:auto 0}
.dialog.wide{width:min(760px,100%)}
.dialog .fields{display:flex;flex-direction:column;gap:12px}
.dialog.wide .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.dialog.wide .fields .full{grid-column:1/-1}
@media (max-width:560px){ .dialog.wide .fields{grid-template-columns:1fr} }
html.modal-open,html.modal-open body{overflow:hidden}
.dialog h3{font-size:18px}
.dialog label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.dialog label>*{color:var(--ink)}
.dialog .checkrow{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.dlg-err{color:var(--bad);margin:0;font-size:13.5px}
.dlg-actions{display:flex;gap:8px;flex-direction:row-reverse;justify-content:flex-start;position:sticky;bottom:0;margin:0 -20px;padding:12px 20px 16px;background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 12px 12px}
.toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:50;box-shadow:var(--shadow);font-weight:500;max-width:90vw}
.sess{display:flex;flex-wrap:wrap;gap:4px}
@media (max-width:980px){ .cols{grid-template-columns:1fr} }
@media (max-width:760px){
  .app{flex-direction:column}
  .rail{position:static;height:auto;width:auto;flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--line);padding:8px}
  .brand,.rail-foot,.nav-group{display:none}
  .nav.ext{margin-top:0}
  .nav{white-space:nowrap}
  main{padding:16px}
}
@media (prefers-reduced-motion:no-preference){ .drawer{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(-24px);opacity:.6}} }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="القائمة الرئيسية"></nav>
  <main id="main"></main>
</div>
<div id="drawer-root"></div>
<script>
'use strict';
/* ============ Constants ============ */
const KINDS={lecture:'محاضرة',section:'سكشن',lab:'معمل'};
const KINDS_PL={lecture:'محاضرات',section:'سكاشن',lab:'معامل'};
const SUB={section:'S',lab:'M'};               // group id letters: L1 = lecture group 1, L1-S2 = its section 2, L1-M1 = its lab 1
const MODE={inperson:'حضوري',online:'أونلاين',hybrid:'حضوري - أونلاين'};
const PTYPE={bachelor:'بكالوريوس (فرق)',credit:'ساعات معتمدة',external:'انتساب',pg:'دراسات عليا'};
const ORD=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة'];
/* Same equipment keys as the rooms system; the rooms system owns this list and sends updates. */
let EQ={projector:'بروجكتور',mic:'ميكروفون وسماعات',ac:'تكييف',internet:'إنترنت',smartboard:'سبورة ذكية',camera:'كاميرا بث',computers:'أجهزة كمبيوتر',excel:'Microsoft Excel',spss:'SPSS',accsoft:'برنامج محاسبي (ERP)'};
/* Menu grouped by workflow: this term's work first, then the bylaw (plans and courses), then setup. */
const NAV_GROUPS=[
  {t:'الترم الحالي',items:[['offer','المواد حسب البرنامج والفرقة'],['outbox','الإرسال لنظام القاعات'],['load','أعباء التدريس']]},
  {t:'اللائحة',items:[['plans','الخطط الدراسية'],['catalog','تفاصيل المواد']]},
  {t:'الإعداد',items:[['master','البيانات الأساسية'],['settings','الإعدادات']]}
];
const NAV=NAV_GROUPS.flatMap(g=>g.items);
const VERSION='النسخة: 15 نوفمبر 12:00';
const PTYPE_ITEM={core:'إجبارية',elective:'اختيارية'};

/* ============ Seed data: كلية إدارة الأعمال (sample) ============ */
function seed(){
  const L=(hours=2,count=12,startWeek=1,perWeek=1)=>({hours,perWeek,count,startWeek});
  const SEC=(count=10,startWeek=3)=>({hours:2,perWeek:1,count,startWeek});

  const st={

    /* One faculty in use today; every department, program, course and staff member carries facultyId so more faculties can join later. */

    ranks:[{id:'prof',name:'أستاذ',kind:'doctor',maxLoad:8},{id:'assoc',name:'أستاذ مساعد',kind:'doctor',maxLoad:10},{id:'lect',name:'مدرس',kind:'doctor',maxLoad:12},{id:'alect',name:'مدرس مساعد',kind:'ta',maxLoad:16},{id:'demo',name:'معيد',kind:'ta',maxLoad:16}],
    settings:{maxGroup:{lecture:350,section:55,lab:35},maxLoad:{doctor:12,ta:16}},
    depts:[{id:'acc',name:'المحاسبة'},{id:'bus',name:'إدارة الأعمال'},{id:'eco',name:'الاقتصاد'},{id:'mis',name:'نظم المعلومات الإدارية'},{id:'sta',name:'الإحصاء والرياضة والتأمين'}],
    majors:[{id:'acc',name:'محاسبة'},{id:'bus',name:'إدارة أعمال'},{id:'eco',name:'اقتصاد'},{id:'mis',name:'نظم معلومات إدارية'}],
    programs:[
      {id:'ar',code:'AR',name:'البرنامج العربي',type:'bachelor',levels:4,majorsFrom:3,majors:['acc','bus','eco','mis'],defaultMode:'inperson'},
      {id:'en',code:'EN',name:'البرنامج الإنجليزي',type:'bachelor',levels:4,majorsFrom:3,majors:['acc','bus'],defaultMode:'inperson'},
      {id:'ch',code:'CH',name:'برنامج الساعات المعتمدة',type:'credit',levels:4,majorsFrom:null,majors:[],defaultMode:'inperson'},
      {id:'in',code:'IN',name:'الانتساب',type:'external',levels:4,majorsFrom:null,majors:[],defaultMode:'online'},
      {id:'dip',code:'DIP',name:'دبلومة الدراسات العليا في إدارة الأعمال',type:'pg',levels:0,majorsFrom:null,majors:[],defaultMode:'inperson'},
      {id:'ms',code:'MS',name:'ماجستير إدارة الأعمال (أكاديمي)',type:'pg',levels:0,majorsFrom:null,majors:[],defaultMode:'inperson'},
      {id:'mba',code:'MBA',name:'ماجستير إدارة الأعمال المهني MBA',type:'pg',levels:0,majorsFrom:null,majors:[],defaultMode:'inperson'}
    ],
    cohorts:[],
    people:[
      {id:'d1',name:'د. أحمد سالم',role:'doctor',dept:'bus'},{id:'d2',name:'د. منى عبد الرحمن',role:'doctor',dept:'bus'},{id:'d3',name:'د. خالد فوزي',role:'doctor',dept:'eco'},
      {id:'d4',name:'د. هالة مصطفى',role:'doctor',dept:'eco'},{id:'d5',name:'د. ياسر النجار',role:'doctor',dept:'bus'},{id:'d6',name:'د. سامي عادل',role:'doctor',dept:'mis'},
      {id:'d7',name:'د. ريم حسن',role:'doctor',dept:'acc'},{id:'d8',name:'د. طارق منصور',role:'doctor',dept:'acc'},{id:'d9',name:'د. نهى إبراهيم',role:'doctor',dept:'sta'},
      {id:'m1',name:'م. سارة علي',role:'ta',dept:'acc'},{id:'m2',name:'م. عمر حسن',role:'ta',dept:'eco'},{id:'m3',name:'م. نورا سمير',role:'ta',dept:'mis'},
      {id:'m4',name:'م. كريم وائل',role:'ta',dept:'sta'},{id:'m5',name:'م. منة الله صلاح',role:'ta',dept:'acc'},
      {id:'m6',name:'م. يوسف عادل',role:'ta',dept:'sta'},{id:'m7',name:'م. دينا فاروق',role:'ta',dept:'eco'},{id:'d10',name:'د. شريف عزمي',role:'doctor',dept:'acc'}
    ],
    courses:[
      {id:'acc101',code:'ACC101',name:'مبادئ المحاسبة المالية',dept:'acc',credits:3,semester:1,sessions:{lecture:L(),section:SEC()},reqs:{lecture:[R('projector',true,'عرض القيود والقوائم المالية'),R('mic')],section:[R('smartboard')]}},
      {id:'bus101',code:'BUS101',name:'مبادئ الإدارة',dept:'bus',credits:3,semester:1,sessions:{lecture:L()},reqs:{lecture:[R('mic',true,'أعداد كبيرة في المدرج'),R('projector')]}},
      {id:'eco101',code:'ECO101',name:'مبادئ الاقتصاد الجزئي',dept:'eco',credits:3,semester:1,sessions:{lecture:L(),section:SEC()},reqs:{lecture:[R('mic',true,'أعداد كبيرة في المدرج')],section:[]}},
      {id:'sta101',code:'STA101',name:'الرياضيات للأعمال',dept:'sta',credits:3,semester:1,sessions:{lecture:L(),section:SEC()},reqs:{lecture:[R('mic')],section:[R('smartboard')]}},

function buildCohorts(st,sizes={},prev=[]){

    for(let l=1;l<=p.levels;l++){
      if(p.majorsFrom&&l>=p.majorsFrom&&p.majors.length){ for(const m of p.majors){ const id=`${p.id}-${l}-${m}`; out.push({id,programId:p.id,level:l,majorId:m,students:old(id)?.students??sizes[id]??0}); } }

    }
  }
  return out;
}

  for(const k of Object.keys(co.sessions)) if(modeOf(o,k)==='hybrid') warn.push(`ال${KINDS[k]} حضوري - أونلاين: سيضيف نظام القاعات كاميرا وميكروفونًا وإنترنت كمتطلبات إلزامية`);
  for(const p of new Set(ss.map(s=>s.instructor).filter(Boolean))) if(overloaded(p)) warn.push(`${person(p).name} فوق الحد الأقصى للعبء`);
  return {bad,warn};
}
function sendState(o){
  if(!o.offered) return ['غير مضافة للترم','off'];
  if(!o.sent) return ['لم تُرسل','acc'];
  return o.sent===JSON.stringify(payload(o))?['أُرسلت إلى نظام القاعات','ok']:['تغيّرت بعد الإرسال','warn'];
}
function send(o){ if(issuesOf(o).bad.length) return false; o.sent=JSON.stringify(payload(o)); o.sentAt=stamp(); o.cancelledSent=false; S.lastSendAt=o.sentAt; return true; }
function diffSent(o){
  if(!o.sent) return [];
  const a=JSON.parse(o.sent), b=payload(o), out=[];
  const ma=new Map(a.sessions.map(s=>[s.ref,s])), mb=new Map(b.sessions.map(s=>[s.ref,s]));
  for(const [r,s] of mb){ const p=ma.get(r);
    if(!p){ out.push(`حصة جديدة: ${r} (${s.students} طالب)`); continue; }
    if(p.students!==s.students) out.push(`${r}: الطلاب ${p.students} ← ${s.students}`);
    if(p.deliveryMode!==s.deliveryMode) out.push(`${r}: ${MODE[p.deliveryMode]} ← ${MODE[s.deliveryMode]}`);
    if((p.instructor&&p.instructor.id)!==(s.instructor&&s.instructor.id)) out.push(`${r}: المحاضر ${p.instructor?p.instructor.name:'—'} ← ${s.instructor?s.instructor.name:'—'}`);
    if(p.fromWeek!==s.fromWeek||p.toWeek!==s.toWeek) out.push(`${r}: الأسابيع ${p.fromWeek}–${p.toWeek} ← ${s.fromWeek}–${s.toWeek}`);
    if(JSON.stringify(p.requirements)!==JSON.stringify(s.requirements)) out.push(`${r}: تغيّرت المتطلبات`);
  }
  for(const r of ma.keys()) if(!mb.has(r)) out.push(`حصة حُذفت: ${r}`);
  return out;
}

/* ============ Link with the rooms system ============
   Prototype transport: both apps share browser storage when opened from the same site.
   This app publishes sent offerings to BUS_CM; the rooms system publishes allocation status to BUS_ROOMS.
   In production this becomes an API between the two systems. */
const BUS_CM='team4.bus.cm.v2', BUS_ROOMS='team4.bus.rooms.v2', SAVE_KEY='team4.cm.state.v2';
const store={
  get(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let ROOMS=store.get(BUS_ROOMS);
function adoptMaster(){ if(ROOMS&&ROOMS.master&&ROOMS.master.equipment) EQ={...EQ,...ROOMS.master.equipment}; }
adoptMaster();
function busPayload(){
  const offerings={};
  for(const o of S.offerings){ if(o.offered&&o.sent) offerings[o.id]=JSON.parse(o.sent); else if(o.cancelledSent) offerings[o.id]={cancelled:true}; }
  return offerings;
}
let lastBus='', lastSave='';
function persist(){
  const {ui,...rest}=S; const j=JSON.stringify(rest);
  if(j!==lastSave){ lastSave=j; store.set(SAVE_KEY,rest); }
  const b=JSON.stringify(busPayload());
  if(b!==lastBus){ lastBus=b; store.set(BUS_CM,{at:S.lastSendAt||stamp(),offerings:JSON.parse(b)}); }
}
function allocOf(o){
  const st=ROOMS&&ROOMS.status||{};
  const list=sessionsOf(o).map(s=>({s,a:st[s.ref]||null}));
  const need=list.filter(x=>x.s.mode!=='online');
  return {list,done:need.filter(x=>x.a&&x.a.state==='scheduled').length,need:need.length,known:list.some(x=>x.a)};
}
const ALLOC_KIND={scheduled:'ok',online:'off',waiting:'bad',unscheduled:'bad',issue:'warn',cancelled:'off',pending:'acc',rejected:'bad',returned:'bad',release:'warn'};
function allocCell(o){
  if(!o.offered||!o.sent) return '<span class="meta">—</span>';
  if(!ROOMS) return '<span class="meta">بانتظار نظام القاعات</span>';
  const a=allocOf(o); if(!a.known) return '<span class="meta">لم تصل بعد</span>';
  const n=s=>a.list.filter(x=>x.a&&x.a.state===s).length;
  if(n('returned')) return pill(`تعذّر توزيع ${n('returned')} حصة`,'bad');
  if(n('rejected')) return pill('رُفض طلب التوزيع','bad');
  if(n('release')) return pill('بانتظار تأكيد الموظف','warn');
  if(n('pending')) return pill(`${n('pending')} مقترح، بانتظار الاعتماد`,'acc');
  return a.need?pill(`${a.done} / ${a.need} وُزّعت`,a.done===a.need?'ok':a.done?'warn':'bad'):pill('أونلاين','off');
}
window.addEventListener('storage',e=>{ if(e.key===BUS_ROOMS){ ROOMS=store.get(BUS_ROOMS); adoptMaster(); render(); } });

function fieldHtml(f){

  let ctl;
  if(f.type==='select') ctl=`<select id="${id}">${f.options.map(([k,t])=>`<option value="${esc(k)}"${String(k)===String(f.value??'')?' selected':''}>${esc(t)}</option>`).join('')}</select>`;

  return `<label for="${id}"${f.full||f.type==='textarea'?' class="full"':''}${f.showIf?` data-show-field="${f.showIf[0]}" data-show-value="${esc(f.showIf[1])}" hidden`:''}>${esc(f.label)}${f.required?' *':''}${ctl}</label>`;
}
function ask(o){
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='overlay';
    ov.innerHTML=`<form class="dialog${o.wide?' wide':''}" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h3 id="dlg-t">${esc(o.title)}</h3>${o.body||''}<div class="fields">${(o.fields||[]).map(fieldHtml).join('')}</div><p class="dlg-err" hidden></p><div class="dlg-actions"><button class="btn ${o.danger?'danger':'primary'}" type="submit">${esc(o.ok||'تأكيد')}</button><button type="button" class="btn ghost" data-x>رجوع</button></div></form>`;
    document.body.append(ov);
    const form=ov.querySelector('form');
    const syncShow=()=>form.querySelectorAll('[data-show-field]').forEach(l=>{ const src=form.querySelector('#f-'+l.dataset.showField); l.hidden=!src||src.value!==l.dataset.showValue; });
    form.addEventListener('change',syncShow); syncShow();
    (form.querySelector('input,select,textarea')||form.querySelector('[type=submit]')).focus();
    document.documentElement.classList.add('modal-open');
    const close=v=>{ ov.remove(); if(!document.querySelector('.overlay')) document.documentElement.classList.remove('modal-open'); res(v); };
    ov.querySelector('[data-x]').onclick=()=>close(null);
    ov.addEventListener('keydown',e=>{ if(e.key==='Escape') close(null); });
    form.onsubmit=e=>{
      e.preventDefault(); const vals={};
      const err=m=>{ const er=form.querySelector('.dlg-err'); er.hidden=false; er.textContent=m; };
      for(const f of o.fields||[]){
        if(f.type==='checks'){ vals[f.id]=[...form.querySelectorAll(`[name="f-${f.id}"]:checked`)].map(x=>x.value); if(f.required&&!vals[f.id].length){ err(`اختر ${f.label}`); return; } continue; }
        const el=form.querySelector('#f-'+f.id); if(el.closest('[hidden]')){ vals[f.id]=''; continue; } vals[f.id]=el.value.trim();
        if(f.required&&!vals[f.id]){ err(`أدخل ${f.label} للمتابعة`); el.focus(); return; }
      }
      close(vals);
    };
  });
}

    const core=items.filter(i=>i.type==='core'), elec=items.filter(i=>i.type==='elective'), k=pkey(l,s,'');

      <td>${i.prereq.map(x=>`<span class="tag${bad.includes(x)?' warn" title="هذا المتطلب لا يسبقها في الخطة':''}">${esc(course(x)?.code||x)}</span>`).join('')||'<span class="meta">—</span>'}</td>

      ${items.length?`<div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>المادة</th><th>س.م</th><th>النوع</th>${hasMaj?'<th>الشعبة</th>':''}<th>متطلب سابق</th><th></th></tr></thead><tbody>${items.map(row).join('')}</tbody></table></div>`:'<div class="meta" style="margin:8px 0">لا توجد مواد بعد.</div>'}
      <div class="inline" style="margin-top:8px"><button class="btn sm" data-act="planAdd" data-l="${l||''}" data-s="${s}">إضافة مادة</button>${elec.length?`<label class="meta">يدرس الطالب <input type="number" min="1" max="${elec.length}" style="width:56px" data-chg="planPick" data-k="${k}" value="${pl.picks[k]||''}" aria-label="عدد المواد الاختيارية"> من ${elec.length} اختياري</label>`:''}</div></div>`;
  };

  ${levels.map(l=>`<section class="panel" style="margin-bottom:14px" aria-label="${esc(levelLabel(p,l))}"><h3>${esc(l?levelLabel(p,l):p.name)}${p.majorsFrom&&l>=p.majorsFrom?` <span class="meta">· بها شعب: ${p.majors.map(m=>esc(major(m).name)).join('، ')}</span>`:''}</h3><div style="display:grid;gap:12px">${sems.map(s=>semBox(l,s)).join('')}</div></section>`).join('')}`;

async function planItemDialog(pl,i,l,s){
  const p=program(pl.programId), hasMaj=p.majorsFrom&&l&&l>=p.majorsFrom;
  const taken=new Set(pl.items.filter(x=>x!==i&&(x.level||null)===l&&x.sem===s&&!hasMaj).map(x=>x.courseId));
  const opts=S.courses.filter(c=>!taken.has(c.id)).sort((a,b)=>(b.semester===s)-(a.semester===s)||a.code.localeCompare(b.code)).map(c=>[c.id,`${c.code} · ${c.name} · ${c.credits} س.م`]);
  const v=await ask({title:i?`تعديل ${course(i.courseId).code} في الخطة`:`إضافة مادة · ${levelLabel(p,l)} · ${semName(s)}`,wide:true,fields:[
    {id:'c',label:'المادة',type:'select',full:true,options:opts,value:i?.courseId||''},
    {id:'type',label:'النوع',type:'select',options:Object.entries(PTYPE_ITEM),value:i?.type||'core'},
    ...(hasMaj?[{id:'major',label:'الشعبة',type:'select',options:[['','مشتركة لكل الشعب'],...p.majors.map(m=>[m,major(m).name])],value:i?.major||''}]:[]),
    {id:'pre',label:'المتطلب السابق',type:'select',options:[['','لا يوجد'],...S.courses.map(c=>[c.id,`${c.code} · ${c.name}`])],value:i?.prereq[0]||''}],ok:i?'حفظ':'إضافة'});
  if(!v) return;
  const data={courseId:v.c,type:v.type,major:hasMaj?(v.major||null):null,prereq:v.pre&&v.pre!==v.c?[v.pre]:[]};
  if(pl.items.some(x=>x!==i&&x.courseId===data.courseId&&(x.level||null)===l&&x.sem===s&&(x.major||null)===data.major)){ toast('هذه المادة موجودة بالفعل في الموضع نفسه من الخطة'); return; }
  if(i) Object.assign(i,data); else pl.items.push({id:nid('pi'),level:l,sem:s,...data});
  toast(i?'تم التعديل':'أُضيفت إلى الخطة، وستظهر كاقتراح في شاشة المواد حسب البرنامج والفرقة.');
}
const PACT={
  planProg(d){ S.ui.planProg=d.id; },
  async planBylaw(){ const pl=planOf(S.ui.planProg); const n=await nameDialog('اسم اللائحة',pl.bylaw); if(n) pl.bylaw=n; },
  async planAdd(d){ await planItemDialog(planOf(S.ui.planProg),null,d.l?Number(d.l):null,Number(d.s)); },
  async planEdit(d){ const pl=planOf(S.ui.planProg), i=pl.items.find(x=>x.id===d.id); await planItemDialog(pl,i,i.level||null,i.sem); },
  planDel(d){ const pl=planOf(S.ui.planProg); const i=pl.items.find(x=>x.id===d.id); pl.items=pl.items.filter(x=>x!==i);
    const n=S.offerings.filter(o=>o.offered&&o.courseId===i.courseId&&o.audiences.some(a=>itemCohorts(pl.programId,i).some(c=>c.id===a))).length;
    toast(n?`حُذفت من الخطة. المادة ما زالت في الترم، وستظهر عليها علامة "خارج الخطة".`:'حُذفت من الخطة'); },
  async planOffer(d){ const g=planGaps().missing.find(x=>x.courseId===d.c); if(!g) return; await offerFromPlan(g,true); },

};
async function offerFromPlan(g,open){
  let students=null;
  if(g.type==='elective'){
    const {p}=selection(), pl=planOf(p.id), sum=g.aud.reduce((a,id)=>a+cohort(id).students,0);
    const n=planGaps().all.filter(x=>x.type==='elective').length, pick=pl.picks[pkey(S.ui.sel.level,S.term.semester,'')]||1;
    const guess=Math.ceil(sum*pick/Math.max(1,n));
    const v=await ask({title:`إضافة ${course(g.courseId).code} للترم · مادة اختيارية`,body:`<p class="meta">سيختار الطلاب ${pick} من ${n} مواد اختيارية، لذلك لن يدرسها كل الـ ${sum} طالب. أدخل العدد المتوقع حتى يصل التسجيل الفعلي.</p>`,fields:[{id:'n',label:'عدد الطلاب المتوقع',type:'number',value:String(guess),min:1,required:true}],ok:'إضافة للترم'});
    if(!v) return; students=Math.max(1,Number(v.n)||guess);
  }
  const o=makeOffering(g.courseId,g.aud); if(students) o.students=students;
  if(open){ S.ui.drawer=o.id; render(); toast('أُضيفت إلى الترم من الخطة. حدّد المحاضرين وراجع المجموعات.'); }
}

  return `<div class="page-head"><div><h2>أعباء التدريس</h2><p>ساعات كل عضو هيئة تدريس أسبوعيًا من جميع البرامج، مقارنةً بالحد الأقصى لدرجته الوظيفية. الأسماء والدرجات واردة من وحدة شؤون أعضاء هيئة التدريس.</p></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>الاسم</th><th>القسم</th><th>الدرجة</th><th>الساعات / الأسبوع</th><th>المواد التي يدرّسها</th></tr></thead><tbody>
  ${rows.map(r=>{ const pct=Math.min(100,Math.round(r.hours/r.max*100)); const c=r.hours>r.max?'var(--bad)':r.hours>=r.max*.85?'var(--warn)':'var(--accent)';

    <td>${r.items.length?r.items.map(x=>`<button class="tag" style="cursor:pointer" data-act="openOff" data-id="${x.o.id}">${esc(x.co.code)} ${esc(progOf(x.o).code)} · ${esc(groupLabel(x.s.group,x.s.lg))} · ${x.s.hours*x.s.perWeek} س</button>`).join(''):'<span class="meta">لا يوجد</span>'}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}

/* ============ Offering drawer ============ */

      <label>الساعات <input type="number" min="1" max="6" style="width:56px" data-chg="plan" data-f="hours" data-id="${o.id}" data-k="${kk}" value="${s.hours}"></label>
      <label>مرات/أسبوع <input type="number" min="1" max="4" style="width:56px" data-chg="plan" data-f="perWeek" data-id="${o.id}" data-k="${kk}" value="${s.perWeek}"></label>
      <label>من أسبوع <input type="number" min="1" max="${S.term.weeks}" style="width:56px" data-chg="plan" data-f="startWeek" data-id="${o.id}" data-k="${kk}" value="${s.startWeek}"></label>

          <div>${list.map(g=>`<div class="grp"><b>${esc(groupLabel(g.id,gs.nL))}</b><span class="num">${g.students} طالب</span><select data-chg="lectStaff" data-id="${o.id}" data-g="${g.id}" aria-label="دكتور ${esc(groupLabel(g.id,gs.nL))}">${opts(doctors,staffOf(o,'lecture',g))}</select></div>`).join('')}</div>`
        :`<div class="inline"><label>عدد ال${KINDS_PL[kk]} في كل مجموعة محاضرة <input type="number" min="1" max="30" style="width:64px" data-chg="subCount" data-id="${o.id}" data-k="${kk}" value="${list.filter(g=>g.parent==='L1').length}"></label>${auto?`<span class="hint">تلقائيًا: حد ${S.settings.maxGroup[kk]} طالب</span>`:`<button class="btn sm ghost" data-act="autoSub" data-id="${o.id}" data-k="${kk}">إعادته تلقائيًا</button>`}</div>
          <div class="inline"><label>المعيد الافتراضي <select data-chg="defaultTA" data-id="${o.id}" data-k="${kk}">${opts([...tas,...doctors],o.ta[kk]||null)}</select></label><span class="hint">${list.length} ${KINDS_PL[kk]} · يمكن تغيير أي منها أدناه</span></div>
          <details${list.length<=6?' open':''}><summary>${list.length} ${KINDS_PL[kk]}</summary><div>${list.map(g=>`<div class="grp"><b>${esc(groupLabel(g.id,gs.nL))}</b><span class="num${g.students>S.settings.maxGroup[kk]?'" style="color:var(--warn)':''}">${g.students} طالب</span><select data-chg="groupStaff" data-id="${o.id}" data-g="${g.id}" aria-label="معيد ${esc(groupLabel(g.id,gs.nL))}">${opts([...tas,...doctors],staffOf(o,kk,g))}</select></div>`).join('')}</div></details>`}
      <div><div class="sec-title">المتطلبات</div>${reqs.map((q,i)=>`<div class="reqline"><span>${esc(EQ[q.eq]||q.eq)}</span><button class="toggle ${q.mandatory?'on':''}" data-act="toggleMand" data-co="${co.id}" data-k="${kk}" data-i="${i}" aria-pressed="${q.mandatory}">${q.mandatory?'إلزامي':'اختياري'}</button><button class="btn sm ghost" data-act="delReq" data-co="${co.id}" data-k="${kk}" data-i="${i}" aria-label="حذف ${esc(EQ[q.eq])}">حذف</button>${q.mandatory?`<input type="text" data-chg="reqReason" data-co="${co.id}" data-k="${kk}" data-i="${i}" value="${esc(q.reason)}" placeholder="سبب الإلزام (مطلوب)" aria-label="سبب إلزام ${esc(EQ[q.eq])}"${q.reason?'':' style="border-color:var(--bad)"'}>`:''}</div>`).join('')||'<div class="meta">لا توجد متطلبات.</div>'}
        <div class="inline" style="margin-top:6px"><select id="add-${co.id}-${kk}" aria-label="متطلب جديد">${Object.entries(EQ).filter(([e])=>!reqs.some(q=>q.eq===e)).map(([e,t])=>`<option value="${e}">${esc(t)}</option>`).join('')}</select><button class="btn sm" data-act="addReq" data-co="${co.id}" data-k="${kk}">إضافة</button></div>
        <p class="hint" style="margin:4px 0 0">خطة التدريس والمتطلبات معرّفة على مستوى المادة، فتسري عليها في كل البرامج.</p></div>
    </section>`;
  };
  const missing=Object.keys(KINDS).filter(x=>!co.sessions[x]);
  return `<div class="drawer-head"><div><div class="meta">${esc(co.code)} · ${esc(dept(co.dept).name)} · ${co.credits} س.م · ${esc(p.name)}</div><h3 id="dr-t">${esc(co.name)}</h3><div style="margin-top:4px">${pill(st,k)}${o.sentAt&&o.offered?` <span class="meta">آخر إرسال ${esc(o.sentAt)}</span>`:''}</div></div><button class="btn ghost" data-act="closeDrawer" aria-label="إغلاق">إغلاق</button></div>
  <div class="drawer-body" id="drawer-body">
    ${!o.offered?`<div class="infobox">حُذفت المادة من الترم لهذه المجموعات. <button class="btn sm" data-act="reoffer" data-id="${o.id}">إعادتها للترم</button></div>`:''}
    <section class="card"><div class="sec-title">مجموعات الطلاب</div><div>${o.audiences.map(id=>`<span class="tag">${esc(cohortName(cohort(id)))} · ${cohort(id).students}</span>`).join('')}</div>
      <div class="inline" style="margin-top:8px"><button class="btn sm" data-act="editAud" data-id="${o.id}">تعديل مجموعات الطلاب</button><label>الطلاب <input type="number" min="1" style="width:100px" data-chg="students" data-id="${o.id}" value="${o.students}"></label>${o.students!==sum?`<button class="btn sm ghost" data-act="useSum" data-id="${o.id}">اجعله مجموع طلاب المجموعات (${sum})</button>`:'<span class="hint">= مجموع طلاب المجموعات</span>'}</div></section>
    ${is.bad.length||is.warn.length?`<div class="issues">${is.bad.map(x=>`<div class="issue bad">${esc(x)}</div>`).join('')}${is.warn.map(x=>`<div class="issue warn">${esc(x)}</div>`).join('')}</div>`:'<div class="okbox">البيانات كاملة وجاهزة للإرسال.</div>'}
    ${k==='warn'&&d.length?`<div class="issue warn"><b>تغيّر بعد آخر إرسال:</b><br>${d.slice(0,12).map(esc).join('<br>')}${d.length>12?'<br>…':''}</div>`:''}
    ${(()=>{ if(!o.offered||!o.sent||!ROOMS) return ''; const ret=allocOf(o).list.filter(x=>x.a&&x.a.state==='returned'); if(!ret.length) return '';
      return `<div class="issue bad"><b>تعذّر توزيع ${ret.length} حصة في نظام القاعات.</b><br>${esc(ret[0].a.label.replace(/^تعذّر التوزيع: /,'السبب: '))}<br>القرار هنا: قسّم المجموعات، أو غيّر طريقة التدريس، أو عدّل الأسابيع، ثم أرسل التحديث. ${k==='ok'?`<button class="btn sm" data-act="resend" data-id="${o.id}" style="margin-top:6px">إعادة الإرسال كما هي</button>`:''}</div>`; })()}
    ${o.offered&&o.sent?`<section><div class="sec-title">حالة التوزيع في نظام القاعات</div><div class="card">${!ROOMS?'<div class="meta">لم يُفتح نظام القاعات بعد. افتحه من الموقع نفسه لتصل الحالة إلى هنا.</div>':allocOf(o).list.map(({s,a})=>`<div class="grp" style="grid-template-columns:minmax(0,1fr) auto"><span><b>${KINDS[s.kind]} · ${esc(groupLabel(s.group,s.lg))}</b> <span class="meta">${a&&a.when?esc(a.when):''}${a&&a.room?' · '+esc(a.room)+' ('+esc(a.building)+')':''}</span></span>${a?pill(a.label,ALLOC_KIND[a.state]||'off'):'<span class="meta">لم تصل بعد</span>'}</div>`).join('')}</div></section>`:''}
    ${Object.keys(co.sessions).map(kindBox).join('')}
    ${missing.length?`<div class="inline">${missing.map(x=>`<button class="btn sm" data-act="addKind" data-co="${co.id}" data-k="${x}">إضافة ${KINDS[x]}</button>`).join('')}</div>`:''}
    <div class="inline">${o.offered&&k!=='ok'?`<button class="btn primary" data-act="sendOne" data-id="${o.id}" ${is.bad.length?'disabled':''}>${k==='warn'?'إرسال تحديث لنظام القاعات':'إرسال لنظام القاعات'}</button>`:''}<button class="btn" data-act="previewGo" data-id="${o.id}">عرض البيانات</button>${o.offered?`<button class="btn danger" data-act="unoffer" data-id="${o.id}">حذف المادة من الترم</button>`:''}</div>
  </div>`;
}

/* ============ Render ============ */
function render(){
  renderRail();
  const v={offer:viewOffer,catalog:viewCatalog,plans:viewPlans,master:viewMaster,load:viewLoad,outbox:viewOutbox,settings:viewSettings}[S.ui.view]||viewOffer;
  $('#main').innerHTML=v();
  const root=$('#drawer-root'); const prev=$('#drawer-body')?.scrollTop||0;
  const o=S.ui.drawer&&S.offerings.find(x=>x.id===S.ui.drawer);
  if(!o){ root.innerHTML=''; root.dataset.key=''; persist(); return; }
  const same=root.dataset.key===o.id;
  root.innerHTML=`<div class="scrim" data-act="closeDrawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-t">${drawerOffering(o)}</aside>`;
  root.dataset.key=o.id; if(same) $('#drawer-body').scrollTop=prev;
  persist();
}
function syncHash(){ const h=location.hash.slice(1); S.ui.view=NAV.some(([k])=>k===h)?h:'offer'; S.ui.drawer=null; render(); window.scrollTo(0,0); }
const freshUI=()=>({view:'offer',planProg:'ar',sel:{program:'ar',level:1,major:''},drawer:null,catFilter:{dept:'',q:''},outFilter:'all',preview:null});
function boot(fresh){
  const saved=fresh?null:store.get(SAVE_KEY);
  if(saved&&saved.version===5){ S={...saved,ui:freshUI()}; return; }
  S=seed(); S.ui=freshUI();
  for(const o of S.offerings) if(o._send){ send(o); o.sentAt=o.id==='of_acc101_ar'?'19 سبتمبر':'10 نوفمبر'; delete o._send; }
  S.lastSendAt='10 نوفمبر';
  // Sample of "changed after sending": student registration grew after BUS201 was sent.
  const b=S.offerings.find(o=>o.id==='of_bus201_ar'); b.students=520;
}

/* ============ Actions ============ */
const findOff=id=>S.offerings.find(o=>o.id===id);
async function pickAudience(title,programId,level,pre=[]){
  const p=program(programId);
  const list=S.cohorts.filter(c=>c.programId===programId&&(!p.levels||c.level===level));
  const v=await ask({title,fields:[{id:'aud',label:'مجموعات الطلاب التي ستدرس المادة',type:'checks',required:true,options:list.map(c=>[c.id,`${cohortName(c,false)} (${c.students})`,pre.includes(c.id)])}],ok:'تأكيد'});
  return v?v.aud:null;
}
function makeOffering(courseId,aud){
  const p=program(cohort(aud[0]).programId);
  let id=`of_${courseId}_${p.id}`; if(S.offerings.some(o=>o.id===id)) id=nid(`of_${courseId}_${p.id}_`);
  const o={id,courseId,audiences:aud,semester:S.term.semester,students:aud.reduce((a,c)=>a+(cohort(c)?.students||0),0),offered:true,modes:{},lgCount:null,subCount:{},staff:{},ta:{},groupStaff:{},sent:null,sentAt:null,cancelledSent:false};
  S.offerings.push(o); return o;
}
const ACT={
  ...MACT,
  ...PACT,
  reset(){ const v=S.ui.view; store.del(SAVE_KEY); boot(true); S.ui.view=v; toast('تمت استعادة البيانات التجريبية'); },
  selProgram(d){ const p=program(d.id); S.ui.sel={program:p.id,level:p.levels?1:null,major:''}; },
  selLevel(d){ S.ui.sel.level=Number(d.v); S.ui.sel.major=''; },
  selMajor(d){ S.ui.sel.major=d.v; },
  openOff(d){ S.ui.drawer=d.id; },
  closeDrawer(){ S.ui.drawer=null; },
  outFilter(d){ S.ui.outFilter=d.v; },
  preview(d){ S.ui.preview=d.id; },
  previewGo(d){ S.ui.preview=d.id; S.ui.drawer=null; location.hash='outbox'; },
  async copyJson(d){ try{ await navigator.clipboard.writeText(JSON.stringify(payload(findOff(d.id)),null,2)); toast('تم النسخ'); }catch(e){ toast('النسخ غير متاح هنا. حدّد النص وانسخه يدويًا.'); } },
  resend(d){ const o=findOff(d.id); o.attempt=(o.attempt||1)+1; if(send(o)) toast('أُعيد الإرسال إلى نظام القاعات'); else toast('أكمل البيانات الناقصة أولًا'); },
  sendOne(d){ const o=findOff(d.id); const was=sendState(o)[1]; if(send(o)) toast(was==='warn'?'أُرسل التحديث إلى نظام القاعات':'أُرسلت إلى نظام القاعات'); else toast('أكمل البيانات الناقصة أولًا'); },
  sendSel(){
    const {ids}=selection();
    const list=S.offerings.filter(o=>o.offered&&o.audiences.some(a=>ids.includes(a))&&semOf(o)===S.term.semester&&sendState(o)[1]!=='ok');
    let ok=0, skip=0; for(const o of list){ if(send(o)) ok++; else skip++; }
    toast(`أُرسلت ${ok}${skip?` · ${skip} لم تُرسل لنقص البيانات`:''}`);
  },
  autoLg(d){ findOff(d.id).lgCount=null; },
  autoSub(d){ delete findOff(d.id).subCount[d.k]; },
  useSum(d){ const o=findOff(d.id); o.students=o.audiences.reduce((a,id)=>a+(cohort(id)?.students||0),0); },
  async editAud(d){
    const o=findOff(d.id); const c0=cohort(o.audiences[0]);
    const aud=await pickAudience('تعديل مجموعات الطلاب',c0.programId,c0.level,o.audiences); if(!aud) return;
    o.audiences=aud; render(); toast('تم تعديل مجموعات الطلاب. راجع عدد الطلاب.');
  },
  async offerHere(){
    const {p,ids}=selection();
    const planned=new Set(planGaps().all.map(g=>g.courseId));
    const cands=S.courses.filter(c=>!S.offerings.some(o=>o.courseId===c.id&&o.offered&&o.audiences.some(a=>ids.includes(a)))).sort((a,b)=>planned.has(b.id)-planned.has(a.id)||(b.semester===S.term.semester)-(a.semester===S.term.semester)||a.code.localeCompare(b.code));
    if(!cands.length){ toast('كل المواد مضافة بالفعل إلى الترم لهذه المجموعات'); return; }
    const v=await ask({title:'إضافة مادة للترم',wide:true,body:'<p class="meta">تظهر مواد الخطة الدراسية أولًا، وأي مادة خارج الخطة ستُضاف مع تنبيه.</p>',fields:[{id:'c',label:'المادة',type:'select',full:true,options:cands.map(c=>[c.id,`${planned.has(c.id)?'':'(خارج الخطة) '}${c.code} · ${c.name} · ${dept(c.dept).name}`])},{id:'aud',label:'مجموعات الطلاب',type:'checks',required:true,options:S.cohorts.filter(c=>c.programId===p.id&&(!p.levels||c.level===S.ui.sel.level)).map(c=>[c.id,`${cohortName(c,false)} (${c.students})`,ids.includes(c.id)])}],ok:'إضافة للترم'});
    if(!v) return; const o=makeOffering(v.c,v.aud); S.ui.drawer=o.id; render(); toast(planned.has(v.c)?'أُضيفت إلى الترم. حدّد المحاضرين وراجع المجموعات.':'أُضيفت إلى الترم، لكن المادة ليست في الخطة الدراسية لهذه المجموعات.');
  },
  async offerCourse(d){
    const opts=[]; for(const p of S.programs){ if(p.levels) for(let l=1;l<=p.levels;l++) opts.push([`${p.id}|${l}`,`${p.name} · ${levelName(p,l)}`]); else opts.push([`${p.id}|`,p.name]); }
    const v=await ask({title:`إضافة ${course(d.id).code} · ${course(d.id).name}`,fields:[{id:'pl',label:'البرنامج والفرقة',type:'select',options:opts}],ok:'التالي'});
    if(!v) return; const [pid,l]=v.pl.split('|');
    const aud=await pickAudience('اختر مجموعات الطلاب',pid,l?Number(l):null,S.cohorts.filter(c=>c.programId===pid&&(!l||c.level===Number(l))).map(c=>c.id));
    if(!aud) return; const o=makeOffering(d.id,aud); S.ui.drawer=o.id; render(); toast('أُضيفت إلى الترم. حدّد المحاضرين وراجع المجموعات.');
  },
  reoffer(d){ findOff(d.id).offered=true; },
  async unoffer(d){
    const o=findOff(d.id); const co=course(o.courseId);
    const v=await ask({title:`حذف ${co.name} من الترم`,body:`<p class="meta">${o.sent?'أُرسلت المادة إلى نظام القاعات من قبل، وسيُرسل إليه الإلغاء. ستظل الأماكن محجوزة حتى يؤكد موظف التوزيع.':'لم تُرسل المادة إلى نظام القاعات.'}</p>`,fields:[{id:'reason',label:'السبب',type:'textarea',required:true}],ok:'حذف المادة من الترم',danger:true});
    if(!v) return; o.offered=false; if(o.sent){ o.sent=null; o.sentAt=null; o.cancelledSent=true; S.lastSendAt=stamp(); } render(); toast('حُذفت المادة من الترم');
  },
  async toggleMand(d){
    const q=course(d.co).reqs[d.k][d.i];
    if(!q.mandatory){
      const v=await ask({title:`${EQ[q.eq]} إلزامي`,body:'<p class="meta">يرى موظف التوزيع هذا السبب أثناء التوزيع، ويمكنه إلغاء الإلزام لحصة واحدة إذا لم يتوفر مكان.</p>',fields:[{id:'reason',label:'سبب الإلزام',type:'textarea',required:true,value:q.reason}],ok:'حفظ'});
      if(!v) return; q.mandatory=true; q.reason=v.reason;
    } else q.mandatory=false;
    render();
  },
  delReq(d){ course(d.co).reqs[d.k].splice(Number(d.i),1); },
  addReq(d){ const co=course(d.co); const e=$(`#add-${d.co}-${d.k}`).value; if(!e) return; (co.reqs[d.k]=co.reqs[d.k]||[]).push({eq:e,mandatory:false,reason:''}); },
  addKind(d){ const co=course(d.co); co.sessions[d.k]={hours:2,perWeek:1,count:d.k==='lecture'?12:10,startWeek:d.k==='lecture'?1:3}; co.reqs[d.k]=co.reqs[d.k]||[]; },
  async newCourse(){
    const v=await ask({title:'مادة جديدة',wide:true,fields:[
      {id:'code',label:'الكود',required:true},{id:'name',label:'الاسم',required:true},
      {id:'dept',label:'القسم المسؤول',type:'select',options:S.depts.map(d=>[d.id,d.name]),value:'bus'},
      {id:'semester',label:'الفصل',type:'select',options:[['1','الأول'],['2','الثاني']],value:String(S.term.semester)},
      {id:'credits',label:'الساعات المعتمدة',type:'number',value:'3',min:1},
      {id:'lectures',label:'عدد المحاضرات في الترم',type:'number',value:'12',min:1},
      {id:'others',label:'عدد السكاشن أو المعامل في الترم',type:'number',value:'10',min:1},
      {id:'kinds',label:'أنواع الحصص',type:'checks',required:true,options:[['lecture','محاضرة',true],['section','سكشن',false],['lab','معمل',false]]}],ok:'إضافة'});
    if(!v) return;
    if(S.courses.some(c=>c.code.toLowerCase()===v.code.toLowerCase())){ toast(`الكود ${v.code} موجود بالفعل`); return; }
    const sessions={}, reqs={}; for(const k of v.kinds){ sessions[k]={hours:2,perWeek:1,count:Math.max(1,Number(k==='lecture'?v.lectures:v.others)||10),startWeek:k==='lecture'?1:3}; reqs[k]=[]; }
    S.courses.push({id:nid('c'),facultyId:S.faculty.id,code:v.code,name:v.name,dept:v.dept,semester:Number(v.semester),credits:Number(v.credits)||3,sessions,reqs});
    render(); toast('تمت إضافة المادة. أضفها إلى الترم من زر "إضافة للترم".');
  },
  async addDept(){ const v=await ask({title:'قسم جديد',fields:[{id:'name',label:'اسم القسم',required:true}],ok:'إضافة'}); if(!v) return; S.depts.push({id:nid('dp'),name:v.name,facultyId:S.faculty.id}); render(); },
  async addMajor(){ const v=await ask({title:'شعبة جديدة',fields:[{id:'name',label:'اسم الشعبة',required:true}],ok:'إضافة'}); if(!v) return; S.majors.push({id:nid('mj'),name:v.name}); render(); toast('تمت الإضافة. فعّلها في البرامج التي تضم هذه الشعبة.'); },
  async addProgram(){ await programDialog(null); },
  async editProgram(d){ await programDialog(program(d.id)); }
};
async function programDialog(p){
  const v=await ask({title:p?`تعديل ${p.name}`:'برنامج جديد',wide:true,fields:[
    {id:'name',label:'اسم البرنامج',required:true,value:p?.name||''},{id:'code',label:'كود مختصر',required:true,value:p?.code||''},
    {id:'type',label:'النوع',type:'select',value:p?.type||'bachelor',options:Object.entries(PTYPE)},
    {id:'levels',label:'عدد الفرق أو المستويات (0 للدراسات العليا)',type:'number',value:String(p?.levels??4),min:0},
    {id:'majorsFrom',label:'الشعب تبدأ من الفرقة (اتركه فارغًا إذا لم توجد شعب)',type:'number',value:p?.majorsFrom?String(p.majorsFrom):''},
    {id:'mode',label:'التدريس الافتراضي',type:'select',value:p?.defaultMode||'inperson',options:Object.entries(MODE)},
    {id:'majors',label:'الشعب المتاحة',type:'checks',options:S.majors.map(m=>[m.id,m.name,p?p.majors.includes(m.id):false])}],ok:p?'حفظ':'إضافة'});
  if(!v) return;
  const data={name:v.name,code:v.code.toUpperCase(),type:v.type,levels:Math.max(0,Number(v.levels)||0),majorsFrom:Number(v.majorsFrom)||null,majors:v.majors,defaultMode:v.mode};
  if(!data.majorsFrom) data.majors=[];
  if(p) Object.assign(p,data); else S.programs.push({id:nid('p'),facultyId:S.faculty.id,...data});
  const before=S.cohorts; S.cohorts=buildCohorts(S,{},before);
  const lost=S.offerings.filter(o=>o.audiences.some(a=>!cohort(a)));
  for(const o of lost) o.audiences=o.audiences.filter(a=>cohort(a));
  render(); toast(lost.length?`تم الحفظ. ${lost.length} مادة في الترم حُذفت منها مجموعات طلاب لم تعد موجودة، يُرجى مراجعتها.`:'تم حفظ البرنامج وتحديث مجموعات الطلاب. سجّل أعداد الطلاب.');
}
const CHG={
  cat(t){ S.ui.catFilter[t.dataset.k]=t.value; },
  students(t){ findOff(t.dataset.id).students=Math.max(1,Number(t.value)||1); },
  cohortStudents(t){ cohort(t.dataset.id).students=Math.max(0,Number(t.value)||0); },
  lectStaff(t){ findOff(t.dataset.id).staff[t.dataset.g]=t.value||null; },
  groupStaff(t){ const o=findOff(t.dataset.id); if(t.value) o.groupStaff[t.dataset.g]=t.value; else delete o.groupStaff[t.dataset.g]; },
  defaultTA(t){ findOff(t.dataset.id).ta[t.dataset.k]=t.value||null; },
  lgCount(t){ findOff(t.dataset.id).lgCount=Math.max(1,Number(t.value)||1); },
  subCount(t){ findOff(t.dataset.id).subCount[t.dataset.k]=Math.max(1,Number(t.value)||1); },
  mode(t){ findOff(t.dataset.id).modes[t.dataset.k]=t.value; },
  plan(t){ const co=course(findOff(t.dataset.id).courseId); co.sessions[t.dataset.k][t.dataset.f]=Math.max(1,Number(t.value)||1); },
  reqReason(t){ course(t.dataset.co).reqs[t.dataset.k][t.dataset.i].reason=t.value.trim(); },
  setting(t){ const [a,b]=t.dataset.k.split('.'); S.settings[a][b]=Math.max(1,Number(t.value)||1); },
  planPick(t){ const pl=planOf(S.ui.planProg); const n=Number(t.value); if(n>0) pl.picks[t.dataset.k]=n; else delete pl.picks[t.dataset.k]; }
};
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t||t.disabled) return;
  const fn=ACT[t.dataset.act]; if(!fn) return; e.preventDefault();
  const r=fn(t.dataset,t); if(r&&r.then) await r; render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.ui.drawer&&!document.querySelector('.overlay')){ S.ui.drawer=null; render(); }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-act]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('change',e=>{ const t=e.target.closest('[data-chg]'); if(!t) return; CHG[t.dataset.chg](t); render(); });
window.addEventListener('hashchange',syncHash);
let S; boot(); syncHash();
</script>
