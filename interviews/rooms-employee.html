<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مقابلة موظف توزيع القاعات والمعامل</title>
<style>
:root{--bg:#f3f7fc;--card:#fff;--ink:#19314f;--muted:#5c7088;--line:#d8e3f0;--accent:#12588e;--soft:#eaf3fd;--gold:#bf944b;--ok:#1b7743}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 Tahoma,'Segoe UI',Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 80px}
.bar{position:sticky;top:0;z-index:5;background:#f3f7fcee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.prog{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.save{white-space:nowrap}
.save.ok{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin:12px 0}
.head{border-top:10px solid var(--accent);position:relative}
.head::after{content:"";position:absolute;top:-10px;right:0;width:90px;height:10px;background:var(--gold);border-top-right-radius:12px}
.org{font-size:12.5px;color:var(--muted)}
h1{font-size:24px;margin:4px 0 6px;line-height:1.4}
.lead{color:var(--muted);margin:0}
.tips{margin:12px 0 0;padding:10px 14px;background:var(--soft);border-radius:8px;font-size:13.5px}
.tips b{color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input{border:0;border-bottom:1px solid var(--line);padding:6px 2px;font:inherit;color:var(--ink);background:transparent}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
.sec{margin:28px 0 4px;display:flex;align-items:center;gap:10px}
.sec span{background:var(--accent);color:#fff;border-radius:8px;padding:6px 14px;font-weight:700;font-size:15px}
.sec small{color:var(--muted)}
.q{border-inline-start:4px solid transparent;transition:border-color .2s}
.q:focus-within{border-inline-start-color:var(--accent)}
.q.done{border-inline-start-color:var(--ok)}
.qt{display:flex;gap:10px;align-items:flex-start;font-size:17px;font-weight:700;line-height:1.6}
.qn{flex:none;min-width:30px;height:30px;border-radius:15px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:13.5px}
.q.done .qn{background:#e3f3ea;color:var(--ok)}
textarea{width:100%;margin-top:12px;border:0;border-bottom:1px solid var(--line);padding:6px 2px;font:inherit;color:var(--ink);resize:none;min-height:38px;background:transparent;overflow:hidden}
textarea::placeholder,input::placeholder{color:#9aabbd}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
button{font:inherit;border-radius:8px;padding:9px 18px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.dlg{position:fixed;inset:0;background:#0f2a4466;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.dlg.on{display:flex}
.dlg .card{max-width:420px}
@media (max-width:560px){.grid{grid-template-columns:1fr}h1{font-size:20px}.qt{font-size:16px}.card{padding:16px}}
</style>
</head>
<body>
<div class="bar"><div class="bar-in"><span id="count">0 من 0</span><div class="prog"><i id="progbar"></i></div><span class="save" id="save"></span></div></div>
<div class="wrap" id="root"></div>
<div class="dlg" id="dlg" role="dialog" aria-modal="true"><div class="card"><b>مسح كل الإجابات؟</b><p class="note">سيُمسح كل ما كُتب في هذا النموذج، ولا يمكن استرجاعه.</p><div class="actions"><button class="pri" id="dlg-yes">مسح</button><button id="dlg-no">إلغاء</button></div></div></div>
<script type="application/json" id="state">{"info":{},"answers":{}}</script>
<script>
const SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const SECTIONS=[
 ['شغلك اليومي','',[
  'ما هي خطوات توزيع القاعات في بداية التيرم؟',
  'من أين تصل بيانات المواد والطلاب؟ ومتى تصل؟',
  'ما هي الأدوات المستخدمة في التوزيع (ورق، Excel، نظام)؟',
  'كم يستغرق التوزيع؟ وما هي أصعب خطوة فيه؟',
  'كم عدد المواد والقاعات والمعامل في التيرم تقريبًا؟']],
 ['القاعات','',[
  'ما هي المعلومات المسجلة عن كل قاعة ومعمل؟ ومن يحدّثها؟',
  'كيف يتم اختيار القاعة المناسبة للمادة؟',
  'كيف يتم معرفة أن قاعة دخلت الصيانة أو أن جهازًا تعطّل؟',
  'ماذا يحدث للمحاضرات عندما تدخل قاعة الصيانة؟']],
 ['الطلبات','',[
  'كيف تصل الطلبات؟ ومن يرسلها؟',
  'كم عدد الطلبات في الأسبوع تقريبًا؟',
  'ما هي البيانات المكتوبة في الطلب؟ وهل يمكن أخذ نسخة من طلب حقيقي؟',
  'ما هي خطوات تنفيذ طلب نقل محاضرة؟',
  'ماذا يحدث إذا لم يوجد مكان متاح للطلب؟',
  'ماذا يحدث إذا طلب اثنان القاعة نفسها في الوقت نفسه؟',
  'كيف يتم التعامل مع المحاضرة التعويضية أو الإضافية؟',
  'هل يتم رفض طلبات؟ وما هي أسباب الرفض؟',
  'من يوافق على التغيير قبل تنفيذه؟']],
 ['التعارض والتغيير','',[
  'كيف يتم التأكد من عدم وجود تعارض في مواعيد المحاضر أو الطلاب؟',
  'ماذا يحدث إذا زاد عدد الطلاب بعد بداية التيرم؟',
  'ماذا يحدث للقاعة عندما تُلغى محاضرة؟',
  'من يتم إبلاغه بعد أي تغيير؟ وكيف؟',
  'هل حدث أن ذهب طلاب أو محاضر إلى القاعة القديمة؟ وما السبب؟']],
 ['المشاكل والختام','',[
  'ما هي أكثر فترة في التيرم يزيد فيها الضغط؟',
  'ما هي أكثر مشكلة تتكرر في التوزيع؟',
  'هل توجد نماذج أو جداول قديمة يمكن أخذ نسخة منها؟',
  'هل هناك شيء آخر يجب أن نعرفه؟',
  'من الشخص الذي تنصحنا بسؤاله أيضًا؟']]
];
const INFO=[['name','اسم الموظف'],['role','الوظيفة / الجهة'],['date','تاريخ المقابلة'],['by','أجرى المقابلة']];
let S={info:{},answers:{}};
try{ S=JSON.parse(document.getElementById('state').textContent)||S; }catch(e){}
const LS='team4.rooms.interview.draft.v3';
try{ const d=JSON.parse(localStorage.getItem(LS)||'null'); if(d&&d.t&&(!S.t||d.t>S.t)) S=d; }catch(e){}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TOTAL=SECTIONS.reduce((n,s)=>n+s[2].length,0);
function render(){
  let n=0,h=`<div class="card head"><div class="org">جامعة الإسكندرية · كلية إدارة الأعمال · E-MISEM</div>
  <h1>مقابلة موظف توزيع القاعات والمعامل</h1>
  <p class="lead">${TOTAL} سؤالًا قصيرًا عن طريقة العمل الحالية: ماذا يحدث فعلًا اليوم.</p>
  <div class="tips"><b>أثناء المقابلة:</b> اطلب مثالًا حقيقيًا ("آخر مرة حدث ذلك...")، واكتب الأرقام كما قالها، واطلب نسخة من أي نموذج أو جدول يذكره.</div>
  <div class="grid">${INFO.map(([k,l])=>`<label class="f">${l}<input data-info="${k}" value="${esc(S.info[k])}" ${k==='date'?'placeholder="مثال: 17 نوفمبر 2026"':''}></label>`).join('')}</div></div>`;
  SECTIONS.forEach(([t,sub,qs],si)=>{
    h+=`<div class="sec"><span>${si+1}. ${t}</span>${sub?`<small>${sub}</small>`:''}</div>`;
    qs.forEach(q=>{ n++; const a=S.answers[n]||'';
      h+=`<div class="card q ${a.trim()?'done':''}" id="q${n}"><div class="qt"><span class="qn">${n}</span><span>${q}</span></div>
      <textarea rows="1" data-q="${n}" aria-label="إجابة السؤال ${n}" placeholder="الإجابة">${esc(a)}</textarea></div>`; });
  });
  h+=`<div class="actions"><button class="pri" id="copy">نسخ الأسئلة والإجابات</button><button id="clear">مسح الإجابات</button></div>
  <p class="note" id="where"></p>`;
  document.getElementById('root').innerHTML=h;
  document.querySelectorAll('textarea').forEach(grow);
  progress();
}
function grow(t){ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }
function progress(){
  const done=Object.values(S.answers).filter(a=>a&&a.trim()).length;
  document.getElementById('count').textContent=`أُجيب ${done} من ${TOTAL}`;
  document.getElementById('progbar').style.width=(done/TOTAL*100)+'%';
}
let shared=null, timer=null, dirty=false;
function setSave(t,ok){ const e=document.getElementById('save'); e.textContent=t; e.className='save'+(ok?' ok':''); }
function changed(){
  S.t=Date.now(); dirty=true;
  try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}
  setSave('جارٍ الحفظ…'); clearTimeout(timer); timer=setTimeout(flush,2500);
}
async function flush(){
  if(!dirty) return; dirty=false;
  if(!shared){ setSave('محفوظ في هذا المتصفح فقط'); return; }
  const json=JSON.stringify(S).replace(/</g,'\\u003c');
  const html=SRC.replace(/(<script type="application\/json" id="state">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
  try{ await shared.publish(html); setSave('تم الحفظ',true); }
  catch(e){ setSave('تعذّر الحفظ في النموذج، ومحفوظ في هذا المتصفح'); }
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.q){ S.answers[t.dataset.q]=t.value; grow(t); t.closest('.q').classList.toggle('done',!!t.value.trim()); progress(); changed(); }
  else if(t.dataset.info){ S.info[t.dataset.info]=t.value; changed(); }
});
document.addEventListener('focusout',e=>{ if(e.target.matches('textarea,input')) { clearTimeout(timer); flush(); } });
document.addEventListener('click',async e=>{
  const id=e.target.id;
  if(id==='copy'){
    let n=0,out=`مقابلة موظف توزيع القاعات والمعامل\n${INFO.map(([k,l])=>`${l}: ${S.info[k]||''}`).join('\n')}\n`;
    SECTIONS.forEach(([t,,qs],si)=>{ out+=`\n${si+1}. ${t}\n`; qs.forEach(q=>{ n++; out+=`\n${n}. ${q}\n${(S.answers[n]||'').trim()||'—'}\n`; }); });
    try{ await navigator.clipboard.writeText(out); e.target.textContent='نُسخ ✓'; setTimeout(()=>e.target.textContent='نسخ الأسئلة والإجابات',1800); }
    catch(_){ e.target.textContent='تعذّر النسخ'; }
  }
  if(id==='clear') document.getElementById('dlg').classList.add('on');
  if(id==='dlg-no') document.getElementById('dlg').classList.remove('on');
  if(id==='dlg-yes'){ document.getElementById('dlg').classList.remove('on'); S={info:{},answers:{}}; render(); changed(); }
});
render(); setSave('');
if(window.claude&&claude.use){ claude.use('artifact').then(a=>{ shared=a;
  document.getElementById('where').textContent=a?'الإجابات تُحفظ داخل النموذج نفسه، فتجدها إذا فتحته من أي جهاز.':'الإجابات تُحفظ في هذا المتصفح فقط. استخدم «نسخ الأسئلة والإجابات» للاحتفاظ بنسخة.';
  if(a&&dirty) flush(); }).catch(()=>{}); }
else document.getElementById('where').textContent='الإجابات تُحفظ في هذا المتصفح فقط. استخدم «نسخ الأسئلة والإجابات» للاحتفاظ بنسخة.';
</script>
</body>
</html>
